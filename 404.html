<!DOCTYPE html>
<html lang="fr"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page bientôt disponible · Bellano</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#EBE9E4;--ink:#121212;--mute:#6E6B66}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,'Arimo',Helvetica,sans-serif}
main{min-height:100vh;max-width:1200px;margin:0 auto;padding:40px;display:flex;flex-direction:column;justify-content:center;gap:28px}
h1{font-family:'Archivo Black','Arial Black',Arial,sans-serif;font-weight:400;font-size:clamp(40px,8vw,96px);line-height:.95;margin:0;text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:24px}
p{font-size:18px;line-height:1.5;margin:0;max-width:56ch}
.en{color:var(--mute)}
a.btn{align-self:flex-start;display:inline-block;background:var(--ink);color:var(--paper);text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:16px 22px}
</style></head><body><main>
<h1>Page bientôt disponible</h1>
<p>Cette page est en cours de préparation. En attendant, retrouvez tous nos studios depuis l'accueil.</p>
<p class="en">This page is coming soon. In the meantime, browse all our studios from the home page.</p>
<a class="btn" href="/">Retour à l'accueil</a>
</main>
<script>/* on a github.io project site, home is /<repo>/ */
if(/github\.io$/.test(location.hostname)){var r=location.pathname.split("/")[1];if(r)document.querySelector("a.btn").href="/"+r+"/";}
</script>
</body></html>
