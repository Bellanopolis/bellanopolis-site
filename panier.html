nEl = subCats.find(sc => {\n            const s = sc.querySelector(':scope > summary');\n            return s && s.textContent.replace(/[×+]/g, '').trim() === 'Catering';\n          });\n          const consommablesEl = subCats.find(sc => {\n            const s = sc.querySelector(':scope > summary');\n            return s && s.textContent.replace(/[×+]/g, '').trim() === 'Consommable';\n          });\n          if (restaurationEl && consommablesEl) {\n            payantGroup.insertBefore(restaurationEl, consommablesEl);\n          }\n        }\n\n        // En mode Casting, ces 3 items de Restauration ne s'appliquent pas\n        const castingHiddenRestoItems = ['resto-petit-dej-standard', 'resto-petit-dej-gourmand', 'resto-dejeuner-bureaux'];\n        castingHiddenRestoItems.forEach(id => {\n          const el = document.getElementById(id);\n          if (el) el.style.display = isCasting ? 'none' : '';\n        });\n\n        const maximalocBlock = document.getElementById('maximaloc-block');\n        if (maximalocBlock) maximalocBlock.style.display = isCasting ? 'none' : '';\n      }\n\n      // En mode Casting, \"Assistant casting\" remonte juste après \"Assistant plateau\"\n      // (au lieu de sa 3e position d'origine), pour rester visible dès l'ouverture\n      // de \"Complétez votre équipe\" sans avoir à faire défiler les autres catégories.\n      reorderCrewForCasting(isCasting);\n      filterCrewForCasting(isCasting, isWebcast);\n    }\n\n    // Studio Casting 02 / 03 : seuls Casting Assistant et Video Technician restent\n    // dans « Complete your team ». Les profils masqués sont décochés pour ne pas\n    // rester dans le devis.\n    const CASTING_HIDDEN_CREW = ['Assistant plateau', 'Assistant photo', 'Réalisateur', 'Photographe',\n      'Producteur', 'Directeur de casting', 'Directeur artistique', 'Créateur de contenu IA',\n      'Styliste', 'Assistant styliste', 'Coaching de marque', 'IA ou conventionnel'];\n    const CASTING_HIDDEN_VT_ITEMS = [\"Opérateur téléprompteur avec prompteur PRO 14\\\"\", 'Ingénieur du son',\n      'Technicien polyvalent caméra et son', 'Technicien polyvalent : installation du studio', 'Assistant polyvalent'];\n    // Studio Webcast : seuls Set assistant et Video Technician restent.\n    const WEBCAST_HIDDEN_CREW = ['Assistant photo', 'Assistant casting', 'Réalisateur', 'Photographe', 'Producteur', 'Directeur de casting',\n      'Directeur artistique', 'Créateur de contenu IA', 'Styliste', 'Assistant styliste', 'Coaching de marque', 'IA ou conventionnel'];\n    function filterCrewForCasting(isCasting, isWebcast) {\n      const container = document.querySelector('#crew-section > div[data-ph=\"not\"]');\n      if (!container) return;\n      // Dans Video Technician, seul « Camera operator » reste pour les studios casting\n      container.querySelectorAll('.opt-check').forEach(c => {\n        if (!CASTING_HIDDEN_VT_ITEMS.includes(c.dataset.label)) return;\n        const li = c.closest('li');\n        const hideItem = isCasting;\n        if (li) li.style.display = hideItem ? 'none' : '';\n        if (hideItem && c.checked) {\n          c.checked = false;\n          c.dispatchEvent(new Event('change', { bubbles: true }));\n        }\n      });\n      container.querySelectorAll(':scope > details.sub-cat').forEach(d => {\n        const nameEl = d.querySelector(':scope > summary .crew-name');\n        const topChk = d.querySelector(':scope > summary .opt-check');\n        const name = nameEl ? nameEl.textContent.trim() : (topChk ? topChk.dataset.label : '');\n        const hide = (isCasting && CASTING_HIDDEN_CREW.includes(name)) || (isWebcast && WEBCAST_HIDDEN_CREW.includes(name));\n        d.style.display = hide ? 'none' : '';\n        if (hide) {\n          d.open = false;\n          d.querySelectorAll('.opt-check:checked').forEach(c => {\n            c.checked = false;\n            c.dispatchEvent(new Event('change', { bubbles: true }));\n          });\n        }\n      });\n    }\n\n    function reorderCrewForCasting(isCasting) {\n      const container = document.querySelector('#crew-section > div[data-ph=\"not\"]');\n      if (!container) return;\n      const subCats = Array.from(container.querySelectorAll(':scope > details.sub-cat'));\n      const findByName = (name) => subCats.find(d => {\n        const el = d.querySelector(':scope > summary .crew-name');\n        return el && el.textContent.trim() === name;\n      });\n      const castingAssistant = findByName('Assistant casting');\n      const videoTechnician = findByName('Technicien vidéo');\n      const director = findByName('Réalisateur');\n      if (!castingAssistant) return;\n      if (isCasting && videoTechnician) {\n        container.insertBefore(castingAssistant, videoTechnician);\n      } else if (!isCasting && director) {\n        container.insertBefore(castingAssistant, director);\n      }\n    }\n\n    // Renseigne ici l'URL de la photo réelle de chaque studio (ex: 'images/casting-02.jpg').\n    // Tant qu'une URL n'est pas renseignée, seul le texte du libellé change.\n    const STUDIO_PHOTOS = {\n      'Studio Photo 00': '',\n      'Studio Photo 01': '',\n      'Studio Vidéo 00': '',\n      'Studio Vidéo 01': '',\n      'Studio Fond Vert 00': '',\n      'Studio Fond Vert 01': '',\n      'Studio Casting 02': '',\n      'Studio Casting 03': '',\n      'Studio Webcast': '',\n      'Studio Fittings': '',\n    };\n\n    function renderStudioPreview() {\n      const { studioName } = getStudioRate();\n      const imgEl = document.getElementById('studio-preview-img');\n      const labelEl = document.getElementById('studio-preview-label');\n      const hasStudio = studioName && studioName !== 'Studio';\n\n      if (labelEl) labelEl.textContent = hasStudio ? `Photo — ${studioName}` : 'Photo · Studio';\n\n      if (imgEl) {\n        const url = hasStudio ? STUDIO_PHOTOS[studioName] : '';\n        imgEl.style.backgroundImage = url ? `url('${url}')` : 'none';\n      }\n    }\n\n    function renderPrelitCleenmainPrices() {\n      const { studioName } = getStudioRate();\n      const isFondVertStudio = (studioName === 'Studio Fond Vert 00' || studioName === 'Studio Fond Vert 01');\n      const prelitDay = document.getElementById('prelit-price-day');\n      const prelitHalf = document.getElementById('prelit-price-half');\n      const cleenmainPrice = document.getElementById('cleenmain-price');\n      if (prelitDay) prelitDay.innerHTML = (isFondVertStudio ? '1450€' : '1350€') + '<span class=\"ppd-unit\">/jour<\/span>';\n      if (prelitHalf) prelitHalf.innerHTML = (isFondVertStudio ? '1205€' : '1120€') + '<span class=\"ppd-unit\">/demi-journée<\/span>';\n      if (cleenmainPrice) cleenmainPrice.textContent = isPhotoStudio() ? formatEuro(PHOTO_TURNKEY_DAY_PRICE * photoDayUnits()) : (isFondVertStudio ? '2370€' : '2200€');\n    }\n\n    // ---- Talents in the order summary ----\n    function escHtml(v) {\n      return String(v == null ? '' : v).replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n    }\n    function currentTalents() {\n      if (typeof window.getBellanoTalents === 'function') return window.getBellanoTalents();\n      try { return JSON.parse(localStorage.getItem('bellanoTalents') || '[]'); } catch (e) { return []; }\n    }\n    function summaryTalentLines() {\n      const ts = currentTalents();\n      if (!ts.length) return [];\n      const out = [{ type: 'category', name: 'Talents du Kollektiv', talent: true }];\n      ts.forEach(t => out.push({\n        type: 'item', talent: true, value: 'Sur devis',\n        name: escHtml(t.name) + ' <span class=\"sl-talent-meta\">' + escHtml(t.id) + ' · ' + escHtml(t.role) + '<\/span>'\n      }));\n      return out;\n    }\n    window.bellanoSummaryTalentLines = summaryTalentLines;\n\n    // Valeur réelle (studio + équipement inclus) vs prix facturé, par studio et par formule,\n    // calculée dans les panneaux « Already included » et réutilisée dans le récapitulatif.\n    const packageSavings = {};\n    function recordSaving(key, value, price) {\n      packageSavings[key] = (price === null || price === undefined || isNaN(price) || isNaN(value)) ? null : { value, price };\n    }\n\n    // Studios Photo, Vidéo et Green Screen : intitulés communs des cartes formules (data-vid-text), texte d'origine ailleurs\n    function applyVideoCardLabels() {\n      const vid = isVideoStudio() || isPhotoStudio();   // Vidéo + Green Screen + Photo\n      document.querySelectorAll('[data-vid-text]').forEach(el => {\n        if (el.dataset.defaultText === undefined) el.dataset.defaultText = el.textContent;\n        el.textContent = vid ? el.dataset.vidText : el.dataset.defaultText;\n      });\n    }\n\n    // Détail du calcul sous le choix de durée, ex. « 1 day × 790€ + ½ day × 550€ = 1340€ »\n    function renderDurationBreakdown() {\n      const el = document.getElementById('duration-breakdown');\n      if (!el) return;\n      const tier = getSelectedTier();\n      const base = computeBasePrice();\n      const n = getNumDays();\n      const half = hasExtraHalf();\n      const { isDemi } = getStudioRate();\n      if (base === null || base === undefined || isNaN(base) || tier === 'studio-offert' || tier === 'casting-long') { el.textContent = ''; return; }\n      const unitN = n + ' ' + (isDemi ? (n > 1 ? 'demi-journées' : 'demi-journée') : (n > 1 ? 'jours' : 'jour'));\n      let txt;\n      if (tier === 'cleenmain' || tier === 'prelit' || tier.indexOf('webcast') === 0 || tier === 'fittings-1' || tier === 'juste-espace') {\n        txt = unitN + (half ? ' + ½ journée' : '') + ' = ' + formatEuro(Math.round(base));\n      } else {\n        const { dayRate, halfRate } = getActiveRates();\n        const unit = isDemi ? halfRate : dayRate;\n        txt = n + ' × ' + (isDemi ? '½ journée' : 'jour') + ' ' + formatEuro(unit) + (half ? ' + ½ journée ' + formatEuro(halfRate) : '') + ' = ' + formatEuro(Math.round(base));\n      }\n      if (tier === 'nu') txt += ' → −15% = ' + formatEuro(base - Math.round(base * NU_DISCOUNT));\n      el.textContent = txt;\n    }\n\n    function recompute() {\n      updateStudioVisibility();\n      renderStudioListPrices();\n      renderLightingList();\n      renderSharedIncludedLists();\n      renderVideoValues();\n      renderTeamList();\n      renderOvertimeList();\n      renderStudioPreview();\n      renderPrelitCleenmainPrices();\n      updateGroupPrices();\n      renderPhotoPage();\n      applyVideoCardLabels();\n      renderDurationBreakdown();\n\n      const tier = getSelectedTier();\n      const { studioName } = getStudioRate();\n      const basePrice = computeBasePrice();\n      let total = basePrice || 0;\n      const lines = [];\n\n      const totalDaysLabel = getTotalDaysLabel();\n      const { isDemi } = getStudioRate();\n      const plural = getNumDays() > 1 || hasExtraHalf();\n      const unitLabel = isDemi ? (plural ? 'demi-journées' : 'demi-journée') : (plural ? 'jours' : 'jour');\n\n      if (tier === 'cleenmain') {\n        lines.push({ type: 'line', name: `\"Clé en main\" package (${totalDaysLabel} ${unitLabel})`, value: (isPhotoStudio() ? 'à partir de ' : '') + formatEuro(basePrice) });\n        lines.push({ type: 'line', name: 'Production complète avec l’équipe du Kollektiv', value: '—' });\n      } else if (tier === 'juste-espace') {\n        const unitOnly = `${totalDaysLabel} ${unitLabel}`;\n        lines.push({ type: 'line', name: `Espace seul : ${unitOnly}`, value: formatEuro(basePrice) });\n        lines.push({ type: 'note', title: 'Plateau entièrement équipé', text: \"Caméra, ordinateur, système d'enregistrement et retour sur écran 60 pouces inclus.\" });\n        lines.push({ type: 'note', title: 'Éclairage prédéfini', text: 'Installation déjà prête, sur cyclorama béton ou fond bleu.' });\n      } else if (tier === 'webcast-simplifie' || tier === 'webcast-habille' || tier === 'webcast-dual') {\n        const unitOnly = `${totalDaysLabel} ${unitLabel}`;\n        const webcastNames = {\n          'webcast-simplifie': 'Simplifié (2 techniciens)',\n          'webcast-habille': 'Habillé (3 techniciens)',\n          'webcast-dual': 'Dual Plateau avec fond Blanc/Vert',\n        };\n        lines.push({ type: 'line', name: `${webcastNames[tier]} — ${unitOnly}`, value: formatEuro(basePrice) });\n\n        if (tier === 'webcast-simplifie') {\n          lines.push({ type: 'note', title: 'Plateau entièrement équipé', text: \"4 caméras Panasonic AW-HE40 (PTZ, pilotage AW-RP50), 5 micros Sennheiser (MZH 3015 W + ME35), régie de diffusion Atem, ordinateur d'encodage, et retour des slides sur 3 écrans 60 pouces. Options simples de split screen et synthé (non animé) incluses. Pas d'intervenant à distance.\" });\n          lines.push({ type: 'note', title: \"Nombre d'intervenants\", text: 'Max. 5 : un présentateur central, avec 2 personnes de chaque côté.' });\n          lines.push({ type: 'note', title: 'Durée du live', text: 'Max. 2h30 par demi-journée.' });\n        } else if (tier === 'webcast-habille') {\n          lines.push({ type: 'note', title: 'Plateau entièrement équipé', text: \"4 caméras Panasonic AW-HE40 (PTZ, pilotage AW-RP50), 5 micros Sennheiser (MZH 3015 W + ME35), ordinateur vMix, ordinateur d'encodage, et retour des slides sur 3 écrans 60 pouces. Options sophistiquées de split screen, synthé et animations graphiques.\" });\n          lines.push({ type: 'note', title: \"Nombre d'intervenants\", text: 'Max. 5 : un présentateur central, avec 2 personnes de chaque côté.' });\n          lines.push({ type: 'note', title: 'Durée du live', text: 'Max. 2h30 par demi-journée.' });\n        } else {\n          lines.push({ type: 'note', title: '2 plateaux entièrement équipés', text: \"4 caméras Panasonic AW-HE40 (plateau télé) + 2 caméras Sony Alpha 7 III (cyclorama), 5 micros Sennheiser (MZH 3015 W + ME35) + micros directionnels/HF sur le cyclorama, ordinateur vMix, ordinateur d'encodage, et retour des slides sur 4 écrans 60 pouces. Options sophistiquées de split screen, synthé et animations graphiques.\" });\n          lines.push({ type: 'note', title: \"Nombre d'intervenants\", text: \"Max. 8 : 2 présentateurs, avec jusqu'à 6 intervenants simultanés.\" });\n          lines.push({ type: 'note', title: 'Durée du live', text: 'Max. 2h30 par demi-journée.' });\n          lines.push({ type: 'note', title: 'Extras (option payante)', text: 'Personnalisation du 2e décor, sur devis.' });\n        }\n      } else if (tier === 'fittings-1') {\n        const unitOnly = `${totalDaysLabel} ${unitLabel}`;\n        lines.push({ type: 'line', name: `Formule essayages : ${unitOnly}`, value: formatEuro(basePrice) });\n      } else if (tier === 'studio-offert') {\n        lines.push({ type: 'line', name: 'Formule « studio offert »', value: formatEuro(basePrice) });\n        lines.push({ type: 'note', title: '4 jours + 1 offert', text: \"Louez 4 jours de studio casting et profitez d’un 5e jour offert.\" });\n        lines.push({ type: 'note', title: 'Même production, même équipe', text: 'Valable tant que les jours concernent la même production et le même directeur de casting.' });\n      } else if (tier === 'casting-long') {\n        lines.push({ type: 'line', name: '\"Feature film casting\" package', value: 'from ' + formatEuro(basePrice) + ' / week' });\n        lines.push({ type: 'note', title: 'Tarif dégressif', text: 'Un tarif adapté aux productions de longs métrages, avec des réservations à la semaine ou au mois.' });\n        lines.push({ type: 'note', title: 'Studio dédié', text: 'Le studio casting reste réservé pour toute la durée de votre production.' });\n      } else if (tier === 'prelit') {\n        if (basePrice !== null) {\n          lines.push({ type: 'line', name: `Studio pré-éclairé (${totalDaysLabel} ${unitLabel})`, value: formatEuro(basePrice) });\n        } else {\n          lines.push({ type: 'line', name: 'Studio pré-éclairé : tarif sur demande', value: '—' });\n        }\n        lines.push({ type: 'note', title: 'Demi-journée pré-light, -50%', text: 'Réservez la demi-journée avant votre tournage à -50% : votre installation est prête à votre arrivée.' });\n        const techPrice = isPhotoStudio() ? PHOTO_PRELIT_TECHNICIAN : 250;\n        lines.push({ type: 'note', title: `Technicien polyvalent, ${techPrice}€`, text: `Un technicien polyvalent installe la veille vos lumières, caméras, son et fonds, pour ${techPrice}€.` });\n      } else {\n        if (basePrice !== null) {\n          lines.push({ type: 'line', name: `${studioName} (${totalDaysLabel} ${unitLabel})`, value: formatEuro(basePrice) });\n        } else {\n          lines.push({ type: 'line', name: `${studioName} : tarif sur demande`, value: '—' });\n        }\n\n        if (tier === 'nu') {\n          const discount = Math.round((basePrice || 0) * NU_DISCOUNT);\n          total -= discount;\n          lines.push({ type: 'line', name: 'Formule « nu » (sans éclairage) : remise sur le tarif studio uniquement', value: '− ' + formatEuro(discount), discount: true });\n        } else {\n          lines.push({ type: 'line', name: 'Formule « avec pack inclus »', value: 'Inclus' });\n        }\n      }\n\n      // Économie de la formule : valeur du studio + équipement inclus vs prix facturé\n      let pkgValue = 0, pkgSaving = 0;\n      if (tier === 'nu') {\n        pkgValue = basePrice || 0;\n        pkgSaving = Math.round((basePrice || 0) * NU_DISCOUNT);\n      } else if (tier === 'pack' || tier === 'prelit' || tier === 'cleenmain') {\n        const kind = isPhotoStudio() ? 'photo' : (isVideoStudio() ? 'video' : null);\n        const rec = kind ? packageSavings[kind + '-' + tier] : null;\n        if (rec && rec.value > rec.price && basePrice !== null) {\n          pkgValue = rec.value;\n          pkgValue = Math.round(pkgValue);\n          pkgSaving = Math.round(rec.value - rec.price);\n          const pctLine = Math.floor(pkgSaving / pkgValue * 100);\n          lines.push({ type: 'line', name: 'Valeur studio + matériel', value: '<span class=\"sl-strike\">' + formatEuro(pkgValue) + '<\/span>', muted: true });\n          lines.push({ type: 'line', name: 'Remise formule (' + pctLine + '%)', value: '−' + formatEuro(pkgSaving), discount: true });\n        }\n      }\n\n      // Supplément automatique week-end / jour férié : 110 € par jour concerné\n      // dans la plage de dates sélectionnée sur le calendrier.\n      const surchargeDays = getWeekendHolidayDaysCount();\n      if (surchargeDays > 0) {\n        const surchargeTotal = surchargeDays * WEEKEND_HOLIDAY_SURCHARGE;\n        total += surchargeTotal;\n        const dayLabel = surchargeDays > 1 ? 'jours' : 'jour';\n        lines.push({ type: 'line', name: `Majoration week-end / jour férié (${surchargeDays} ${dayLabel})`, value: '+ ' + formatEuro(surchargeTotal) });\n      }\n\n      // Paid options groupées par catégorie — la catégorie n'apparaît\n      // que si au moins une option de ce groupe est cochée.\n      document.querySelectorAll('.sub-cat').forEach(details => {\n        const checked = Array.from(details.querySelectorAll('.opt-check')).filter(c => c.checked && c.closest('.sub-cat') === details);\n        if (checked.length === 0) return;\n\n        const summaryClone = details.querySelector(':scope > summary').cloneNode(true);\n        summaryClone.querySelectorAll('.rm, .pm-slot').forEach(el => el.remove());\n        lines.push({ type: 'category', name: summaryClone.textContent.trim() });\n\n        checked.forEach(chk => {\n          const price = parseFloat(chk.dataset.price) || 0;\n          total += price;\n          lines.push({ type: 'item', name: chk.dataset.label, value: price > 0 ? '+ ' + formatEuro(price) : '—' });\n        });\n      });\n\n      // Talents chosen on the Kollektiv / Coaching pages (fees confirmed in the quote)\n      summaryTalentLines().forEach(l => lines.push(l));\n\n      summaryList.innerHTML = '';\n      lines.forEach(l => {\n        const li = document.createElement('li');\n        if (l.type === 'category') {\n          li.className = 'summary-category' + (l.talent ? ' summary-talent' : '');\n          li.textContent = l.name;\n        } else if (l.type === 'note') {\n          li.className = 'summary-note';\n          li.innerHTML = '<span class=\"sn-title\">' + l.title + '<\/span><span class=\"sn-text\">' + l.text + '<\/span>';\n        } else {\n          li.classList.add(l.type === 'item' ? 'summary-item' : 'summary-base');\n          if (l.discount) li.classList.add('discount');\n          if (l.muted) li.classList.add('muted');\n          if (l.talent) li.classList.add('summary-talent');\n          li.innerHTML = '<span class=\"sl-name\">' + l.name + '<\/span><span class=\"sl-val\">' + l.value + '<\/span>';\n        }\n        summaryList.appendChild(li);\n      });\n\n      emptyNote.style.display = 'none';\n      document.querySelector('.discount-note').style.display = (tier === 'nu') ? 'block' : 'none';\n      totalValue.textContent = formatEuro(total);\n      if (totalValueVat) totalValueVat.textContent = formatEuro(Math.round(total * (1 + VAT_RATE)));\n\n      // Prix barré + pastilles « You save » / « % OFF » (mêmes pastilles que le panneau Already included)\n      const pct = pkgValue > 0 ? Math.floor(pkgSaving / pkgValue * 100) : 0;\n      const showSaving = pkgSaving > 0 && pct > 0;\n      ['', 'billing-'].forEach(pre => {\n        const oldEl = document.getElementById(pre + 'total-old');\n        const saveEl = document.getElementById(pre + 'total-save');\n        const offEl = document.getElementById(pre + 'total-off');\n        if (oldEl) oldEl.textContent = showSaving ? formatEuro(total + pkgSaving) : '';\n        if (saveEl) saveEl.textContent = showSaving ? 'Vous économisez\\u00a0' + formatEuro(pkgSaving) : '';\n        if (offEl) offEl.textContent = showSaving ? pct + '%\\u00a0de remise' : '';\n      });\n\n      // Le récapitulatif de l'étape « Facturation » reprend le même contenu.\n      if (billingSummaryList) billingSummaryList.innerHTML = summaryList.innerHTML;\n      if (billingTotalValue) billingTotalValue.textContent = totalValue.textContent;\n      if (billingTotalValueVat && totalValueVat) billingTotalValueVat.textContent = totalValueVat.textContent;\n    }\n\n    window.bellanoRecompute = recompute;\n    tierRadios.forEach(r => r.addEventListener('change', recompute));\n\n    // \"Formule studio offert\" = 5 jours (4 loués + 1 offert). On pré-sélectionne\n    // une plage de 5 jours dans le calendrier, que le client peut ensuite déplacer librement.\n    const studioOffertRadio = document.getElementById('tier-studio-offert');\n    if (studioOffertRadio) {\n      studioOffertRadio.addEventListener('change', () => {\n        if (studioOffertRadio.checked) {\n          if (selectedStart === null) selectedStart = 14;\n          selectedEnd = selectedStart + 4;\n          renderCalendarSelection();\n          recompute();\n        }\n      });\n    }\n    document.querySelectorAll('.gh-select').forEach(el => {\n      el.addEventListener('click', e => e.stopPropagation());\n    });\n    optChecks.forEach(c => c.addEventListener('change', recompute));\n    document.querySelectorAll('input[name=\"heures-jour\"]').forEach(r => r.addEventListener('change', recompute));\n    // Durée : ½ journée / journée(s) / journée(s) + ½ journée → met à jour heures-jour + extra-half-day\n    document.querySelectorAll('input[name=\"duree\"]').forEach(r => r.addEventListener('change', () => {\n      const v = document.querySelector('input[name=\"duree\"]:checked').value;\n      document.querySelector('input[name=\"heures-jour\"][value=\"' + (v === 'demi' ? 'demi' : 'jour') + '\"]').checked = true;\n      document.getElementById('extra-half-day').checked = (v === 'jour-demi');\n      recompute();\n    }));\n    document.getElementById('extra-half-day').addEventListener('change', recompute);\n    document.querySelectorAll('.mc-day').forEach(day => day.addEventListener('click', handleDayClick));\n\n    renderCalendarSelection();\n    recompute();\n\n    // ---- Promo code : feedback simple, la vérification réelle se fait côté équipe/backend ----\n    const promoInput = document.getElementById('promo-input');\n    const promoBtn = document.getElementById('promo-btn');\n    const promoFeedback = document.getElementById('promo-feedback');\n\n    function applyPromo() {\n      const code = promoInput.value.trim();\n      promoFeedback.classList.remove('ok', 'error');\n      if (!code) {\n        promoFeedback.textContent = 'Merci de saisir un code.';\n        promoFeedback.classList.add('error');\n        return;\n      }\n      promoFeedback.textContent = `Code « ${code} » enregistré : il sera vérifié et appliqué par notre équipe.`;\n      promoFeedback.classList.add('ok');\n    }\n\n    if (promoBtn) promoBtn.addEventListener('click', applyPromo);\n    if (promoInput) promoInput.addEventListener('keydown', e => {\n      if (e.key === 'Enter') { e.preventDefault(); applyPromo(); }\n    });\n\n    // Bouton × : décoche l'option correspondante\n    document.querySelectorAll('.rm-btn').forEach(btn => {\n      btn.addEventListener('click', () => {\n        const chk = btn.closest('li').querySelector('.opt-check');\n        if (chk) { chk.checked = false; recompute(); }\n      });\n    });\n\n    // Sélecteur de studio : choisir une option met à jour l'affichage, referme le menu,\n    // révèle le contenu principal (masqué tant qu'aucun studio n'est choisi) et recalcule le prix\n    document.querySelectorAll('.r-options li').forEach(li => {\n      li.addEventListener('click', () => {\n        const details = li.closest('details');\n        details.querySelectorAll('.r-options li').forEach(o => o.classList.remove('is-active'));\n        li.classList.add('is-active');\n        details.querySelector('.r-value').textContent = li.dataset.name;\n        details.removeAttribute('open');\n\n        const mainContent = document.getElementById('main-content');\n        const studioPrompt = document.getElementById('studio-prompt');\n        if (mainContent) mainContent.style.display = '';\n        if (studioPrompt) studioPrompt.style.display = 'none';\n\n        recompute();\n      });\n    });\n\n    // Un seul menu déroulant ouvert à la fois dans le récapitulatif\n    document.querySelectorAll('.recap-card details.as-details').forEach(d => {\n      d.addEventListener('toggle', () => {\n        if (d.open) {\n          document.querySelectorAll('.recap-card details.as-details').forEach(other => {\n            if (other !== d) other.removeAttribute('open');\n          });\n        }\n      });\n    });\n\n    // ---- Tous les blocs dépliables du site s'ouvrent/se ferment au clic sur\n    // leur en-tête (comportement natif de <details>/<summary>). ----\n\n    // Clic en dehors d'un bloc (studio / dates) : on le referme\n    document.addEventListener('click', (e) => {\n      document.querySelectorAll('.recap-card details.as-details[open]').forEach(d => {\n        if (!d.contains(e.target)) d.removeAttribute('open');\n      });\n    });\n\n    // ---- Envoi de document : sélection, glisser-déposer et prévisualisation ----\n    const docInput = document.getElementById('doc-upload');\n    const dropzone = document.querySelector('.dropzone');\n    const previewGrid = document.getElementById('file-preview-grid');\n    let uploadedFiles = [];\n\n    function renderPreviews() {\n      previewGrid.innerHTML = '';\n      uploadedFiles.forEach((file, index) => {\n        const card = document.createElement('div');\n        card.className = 'file-preview';\n\n        if (file.type.startsWith('image/')) {\n          const img = document.createElement('img');\n          img.src = URL.createObjectURL(file);\n          card.appendChild(img);\n        } else {\n          const ext = (file.name.split('.').pop() || 'file').toUpperCase();\n          const icon = document.createElement('div');\n          icon.className = 'fp-icon';\n          icon.textContent = ext;\n          card.appendChild(icon);\n        }\n\n        const name = document.createElement('div');\n        name.className = 'fp-name';\n        name.textContent = file.name;\n        card.appendChild(name);\n\n        const removeBtn = document.createElement('button');\n        removeBtn.className = 'fp-remove';\n        removeBtn.type = 'button';\n        removeBtn.setAttribute('aria-label', 'Retirer ce fichier');\n        removeBtn.textContent = '×';\n        removeBtn.addEventListener('click', () => {\n          uploadedFiles.splice(index, 1);\n          renderPreviews();\n        });\n        card.appendChild(removeBtn);\n\n        previewGrid.appendChild(card);\n      });\n    }\n\n    function addFiles(fileList) {\n      uploadedFiles = uploadedFiles.concat(Array.from(fileList));\n      renderPreviews();\n    }\n\n    if (docInput) {\n      docInput.addEventListener('change', () => addFiles(docInput.files));\n    }\n\n    if (dropzone) {\n      ['dragenter', 'dragover'].forEach(evt => {\n        dropzone.addEventListener(evt, (e) => {\n          e.preventDefault();\n          dropzone.classList.add('dragover');\n        });\n      });\n      ['dragleave', 'drop'].forEach(evt => {\n        dropzone.addEventListener(evt, (e) => {\n          e.preventDefault();\n          dropzone.classList.remove('dragover');\n        });\n      });\n      dropzone.addEventListener('drop', (e) => {\n        if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);\n      });\n    }\n\n    // ---- Informations de facturation : validation des champs obligatoires ----\n    const billingForm = document.getElementById('billing-form');\n    const EMAIL_RE = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;\n\n    function validateBillingForm() {\n      if (!billingForm) return true;\n      let isValid = true;\n      let firstInvalidInput = null;\n\n      billingForm.querySelectorAll('.billing-field').forEach((field) => {\n        const input = field.querySelector('.billing-input');\n        if (!input || !input.hasAttribute('required')) return;\n\n        const value = input.value.trim();\n        const isEmail = input.type === 'email';\n        const fieldValid = value !== '' && (!isEmail || EMAIL_RE.test(value));\n\n        field.classList.toggle('field-error', !fieldValid);\n        input.classList.toggle('field-error', !fieldValid);\n\n        if (!fieldValid) {\n          isValid = false;\n          if (!firstInvalidInput) firstInvalidInput = input;\n        }\n      });\n\n      if (firstInvalidInput) {\n        firstInvalidInput.closest('.billing-section').scrollIntoView({ behavior: 'smooth', block: 'center' });\n        firstInvalidInput.focus();\n      }\n\n      return isValid;\n    }\n\n    if (billingForm) {\n      billingForm.querySelectorAll('.billing-input[required]').forEach((input) => {\n        input.addEventListener('input', () => {\n          const field = input.closest('.billing-field');\n          const value = input.value.trim();\n          const isEmail = input.type === 'email';\n          const fieldValid = value !== '' && (!isEmail || EMAIL_RE.test(value));\n          if (fieldValid) {\n            field.classList.remove('field-error');\n            input.classList.remove('field-error');\n          }\n        });\n      });\n    }\n\n    // ---- Navigation entre les 3 étapes : Panier → Facturation → Confirmation ----\n    const cartStep = document.getElementById('cart-step');\n    const billingStep = document.getElementById('billing-step');\n    const confirmationStep = document.getElementById('confirmation-step');\n\n    function goToStep(step) {\n      if (cartStep) cartStep.style.display = (step === 'cart') ? '' : 'none';\n      if (billingStep) billingStep.style.display = (step === 'billing') ? '' : 'none';\n      if (confirmationStep) confirmationStep.style.display = (step === 'confirmation') ? '' : 'none';\n      if (step === 'billing') {\n        // \"Envoyer ma demande\" lands directly on \"Vos coordonnées\"\n        const contact = document.getElementById('contact-details');\n        if (contact) {\n          requestAnimationFrame(() => {\n            contact.scrollIntoView({ behavior: 'smooth', block: 'start' });\n            const first = contact.querySelector('input, select, textarea');\n            if (first) setTimeout(() => first.focus({ preventScroll: true }), 450);\n          });\n          return;\n        }\n      }\n      window.scrollTo({ top: 0, behavior: 'smooth' });\n    }\n\n    const gotoBillingBtn = document.getElementById('goto-billing-btn');\n    if (gotoBillingBtn) gotoBillingBtn.addEventListener('click', () => goToStep('billing'));\n\n    const submitBillingBtn = document.getElementById('submit-billing-btn');\n    if (submitBillingBtn) {\n      submitBillingBtn.addEventListener('click', () => {\n        if (validateBillingForm()) goToStep('confirmation');\n      });\n    }\n\n    ['back-to-cart-link', 'back-to-cart-link-2'].forEach(id => {\n      const link = document.getElementById(id);\n      if (link) link.addEventListener('click', (e) => { e.preventDefault(); goToStep('cart'); });\n    });\n  <\/script>\n\n\n  <!-- =====================================================================\n       TALENT REQUEST — receives the talents chosen on the Kollektiv page,\n       allows a talent-only request, and sends the full request.\n       ===================================================================== -->\n  <script>\n  (function () {\n    // ---- SETTINGS -----------------------------------------------------\n    // Address of the Kollektiv cards page. Change it when the site goes live.\n    const KOLLEKTIV_URL = 'kollektiv-cards.html';\n    // Where the request is sent. Leave empty while testing: the confirmation\n    // page then shows a preview of what your team would receive.\n    // Example with Formspree: 'https://formspree.io/f/xxxxxxx'\n    const FORM_ENDPOINT = '';\n    const STORE_KEY = 'bellanoTalents';\n\n    // Which Kollektiv section each \"Find the profile\" link should open\n    const ROLE_ANCHORS = {\n      'Technicien vidéo': 'cat-video-technician',\n      'Cadreur making-of': 'cat-video-technician',\n      'Ingénieur du son': 'cat-video-technician',\n      'Photographie produit : directeur de la photographie': 'cat-photographer',\n      'Assistant photo': 'cat-photo-assistant',\n      'Assistant casting': 'cat-casting-assistant'\n    };\n\n    // ---- 1. Read the talents ------------------------------------------\n    let talents = [];\n    try { talents = JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch (e) {}\n    try {\n      const fromUrl = new URLSearchParams(location.search).get('talents');\n      if (fromUrl) talents = JSON.parse(fromUrl);\n    } catch (e) {}\n    function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(talents)); } catch (e) {} }\n    save();\n\n    const panel = document.getElementById('talent-panel');\n    const list = document.getElementById('tp-list');\n    const onlyRow = document.getElementById('tp-only-row');\n    const moreLink = document.getElementById('tp-more');\n    const mainContent = document.getElementById('main-content');\n    const studioPrompt = document.getElementById('studio-prompt');\n    let talentOnly = false;\n\n    const studioChosen = () => !!document.querySelector('.r-options li.is-active');\n    const kollektivLink = () => KOLLEKTIV_URL + '?talents=' + encodeURIComponent(JSON.stringify(talents));\n\n    window.getBellanoTalents = () => talents.slice();\n\n    // Billing summary when the client books talents without a studio\n    function renderTalentOnlySummary() {\n      const lines = document.getElementById('billing-summary-lines');\n      let html =\n        '<li class=\"summary-note\"><span class=\"sn-title\">Demande de talents uniquement<\/span>' +\n        '<span class=\"sn-text\">Aucun studio réservé. Les cachets de chaque talent sont confirmés dans votre devis.<\/span><\/li>';\n      const make = window.bellanoSummaryTalentLines;\n      (make ? make() : []).forEach(l => {\n        html += l.type === 'category'\n          ? '<li class=\"summary-category summary-talent\">' + l.name + '<\/li>'\n          : '<li class=\"summary-item summary-talent\"><span class=\"sl-name\">' + l.name + '<\/span><span class=\"sl-val\">' + l.value + '<\/span><\/li>';\n      });\n      lines.innerHTML = html;\n    }\n\n    function renderTalents() {\n      panel.hidden = talents.length === 0;\n      list.innerHTML = '';\n      talents.forEach(t => {\n        const li = document.createElement('li');\n        li.innerHTML =\n          '<span><span class=\"tp-name\"><\/span> <span class=\"tp-role\"><\/span><br><span class=\"tp-id\"><\/span><\/span>' +\n          '<span class=\"tp-price\">Sur devis<\/span>' +\n          '<button type=\"button\" class=\"tp-rm\">×<\/button>';\n        li.querySelector('.tp-name').textContent = t.name;\n        li.querySelector('.tp-role').textContent = '· ' + t.role;\n        li.querySelector('.tp-id').textContent = 'ID ' + t.id;\n        const rm = li.querySelector('.tp-rm');\n        rm.setAttribute('aria-label', 'Retirer ' + t.name);\n        rm.addEventListener('click', () => {\n          talents = talents.filter(x => x.id !== t.id);\n          save();\n          renderTalents();\n          if (talents.length === 0 && talentOnly) leaveTalentOnly();\n        });\n        list.appendChild(li);\n      });\n      onlyRow.style.display = (studioChosen() || talentOnly) ? 'none' : '';\n      moreLink.href = kollektivLink();\n      // Keep the order summary in step with the talent list\n      if (talentOnly) renderTalentOnlySummary();\n      else if (studioChosen() && typeof window.bellanoRecompute === 'function') window.bellanoRecompute();\n    }\n\n    // ---- 2. Talent-only path (no studio) ------------------------------\n    // Goes straight to the contact step; the price summary says \"on quote\".\n    document.getElementById('tp-only').addEventListener('click', () => {\n      talentOnly = true;\n      mainContent.style.display = '';\n      studioPrompt.style.display = 'none';\n      goToStep('billing');\n      renderTalentOnlySummary();\n      document.getElementById('billing-total-value').textContent = 'Sur devis';\n      const vat = document.getElementById('billing-total-value-vat');\n      if (vat && vat.parentElement) vat.parentElement.style.visibility = 'hidden';\n      renderTalents();\n    });\n\n    function leaveTalentOnly() {\n      talentOnly = false;\n      mainContent.style.display = 'none';\n      studioPrompt.style.display = '';\n      const vat = document.getElementById('billing-total-value-vat');\n      if (vat && vat.parentElement) vat.parentElement.style.visibility = '';\n      goToStep('cart');\n      renderTalents();\n    }\n\n    // \"Back to cart\" from a talent-only request returns to the studio choice\n    ['back-to-cart-link', 'back-to-cart-link-2'].forEach(id => {\n      const link = document.getElementById(id);\n      if (link) link.addEventListener('click', () => { if (talentOnly) leaveTalentOnly(); });\n    });\n\n    // Choosing a studio ends talent-only mode and hides the shortcut\n    document.querySelectorAll('.r-options li').forEach(li => li.addEventListener('click', () => {\n      talentOnly = false;\n      const vat = document.getElementById('billing-total-value-vat');\n      if (vat && vat.parentElement) vat.parentElement.style.visibility = '';\n      renderTalents();\n    }));\n\n    // ---- 3. Links back to the Kollektiv --------------------------------\n    document.querySelectorAll('.find-profile').forEach(a => {\n      const chk = a.closest('li') && a.closest('li').querySelector('.opt-check');\n      const anchor = chk && ROLE_ANCHORS[chk.dataset.label];\n      a.href = KOLLEKTIV_URL + (anchor ? '#' + anchor : '');\n      a.addEventListener('click', e => e.stopPropagation()); // don't tick the checkbox\n    });\n    document.querySelectorAll('.kollektiv-bar, .crew-link:not(.crew-link-direct), .locked-note .link-inline:not(.crew-link-direct)').forEach(a => {\n      a.href = KOLLEKTIV_URL;\n    });\n\n    // ---- 4. Build and send the request ---------------------------------\n    const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };\n    const text = el => el ? el.textContent.replace(/\\s+/g, ' ').trim() : '';\n\n    function buildRequest() {\n      const recapValues = document.querySelectorAll('.recap-item .r-value');\n      const company = val('billing-societe');\n      const names = talents.map(t => t.id).join(', ');\n      return {\n        subject: (talents.length ? 'Demande : ' + names + ' — ' : 'Demande de réservation — ') + company,\n        contact: {\n          firstName: val('billing-prenom'), lastName: val('billing-nom'), company,\n          phone: val('billing-tel'), email: val('billing-email'), billingAddress: val('billing-adresse')\n        },\n        talents: talents.map(t => ({ id: t.id, name: t.name, role: t.role })),\n        studio: talentOnly ? 'Aucun studio (demande de talents uniquement)' : text(recapValues[0]),\n        dates: text(recapValues[1]),\n        options: talentOnly ? [] : [...document.querySelectorAll('#summary-lines li:not(.summary-talent)')].map(li => li.children.length > 1 ? [...li.children].map(text).filter(Boolean).join(' : ') : text(li)).filter(Boolean),\n        estimatedTotal: talentOnly ? 'Sur devis' : text(document.getElementById('total-value')) + ' HT',\n        sentAt: new Date().toISOString()\n      };\n    }\n\n    function asReadableEmail(r) {\n      const c = r.contact;\n      return [\n        'Objet : ' + r.subject, '',\n        'CONTACT',\n        [c.firstName, c.lastName].filter(Boolean).join(' ') ? [c.firstName, c.lastName].filter(Boolean).join(' ') + ' — ' + c.company : c.company,\n        c.email + ' · ' + c.phone,\n        c.billingAddress, '',\n        'TALENTS REQUESTED',\n        ...(r.talents.length ? r.talents.map(t => '• ' + t.id + '  ' + t.name + ' (' + t.role + ')') : ['None']), '',\n        'STUDIO: ' + r.studio,\n        'DATES: ' + r.dates,\n        ...(r.options.length ? ['OPTIONS:', ...r.options.map(o => '• ' + o)] : []),\n        'ESTIMATED TOTAL: ' + r.estimatedTotal\n      ].join('\\n');\n    }\n\n    async function sendRequest() {\n      const request = buildRequest();\n      const btn = document.getElementById('submit-billing-btn');\n      btn.disabled = true;\n      btn.textContent = 'Sending…';\n      let sent = false;\n      if (FORM_ENDPOINT) {\n        try {\n          const res = await fetch(FORM_ENDPOINT, {\n            method: 'POST',\n            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },\n            body: JSON.stringify({ ...request, message: asReadableEmail(request) })\n          });\n          sent = res.ok;\n        } catch (e) { sent = false; }\n        if (!sent) {\n          btn.disabled = false;\n          btn.textContent = 'Envoyer ma demande';\n          alert('Votre demande n’a pas pu être envoyée. Vérifiez votre connexion et réessayez, ou écrivez à kollektiv@bellanopolis.com.');\n          return;\n        }\n      }\n      btn.disabled = false;\n      btn.textContent = 'Envoyer ma demande';\n      goToStep('confirmation');\n      panel.hidden = true;\n      talents = []; save();\n\n      // While no endpoint is set, show what the team would receive\n      if (!FORM_ENDPOINT) {\n        const conf = document.getElementById('confirmation-step');\n        let box = document.getElementById('request-preview');\n        if (!box) {\n          box = document.createElement('div');\n          box.className = 'request-preview';\n          box.id = 'request-preview';\n          box.innerHTML = '<div class=\"rp-box\"><p class=\"rp-note\">Mode test : rien n’a été envoyé. ' +\n            'Voici l’e-mail que votre équipe recevra une fois FORM_ENDPOINT configuré.<\/p><pre><\/pre><\/div>';\n          conf.appendChild(box);\n        }\n        box.querySelector('pre').textContent = asReadableEmail(request);\n      }\n    }\n\n    // Take over the final \"Envoyer ma demande\" button: same validation, then send\n    const oldBtn = document.getElementById('submit-billing-btn');\n    const newBtn = oldBtn.cloneNode(true);       // drops the old \"confirmation only\" handler\n    oldBtn.replaceWith(newBtn);\n    newBtn.addEventListener('click', () => { if (validateBillingForm()) sendRequest(); });\n\n    renderTalents();\n  })();\n  <\/script>\n\n\n  <!-- =====================================================================\n       HARMONICAS — same \"+ / More\" circle as the home page menu.\n       The circle sits on the left of each accordion title, stretches into\n       a black \"More\" pill when you hover the row, and turns into \"×  Close\"\n       once open. Clicking anywhere on the row (icon OR title text) opens it.\n       Sizes come from --pm-k exactly like on the home page (0.625).\n       ===================================================================== -->\n  <style>\n    .pm-slot {\n      --pm-k: 0.625;\n      --d:  calc(34px * var(--pm-k));                    /* circle diameter */\n      --bw: max(1px, calc(1.5px * var(--pm-k)));         /* ring + plus stroke */\n      --pw: calc(112px * var(--pm-k));                   /* pill width */\n      position: relative; flex: none;\n      width: var(--pw); height: var(--d);                /* fixed slot = no layout shift */\n      margin-right: 4px;\n    }\n    .pm-btn {\n      position: absolute; left: 0; top: 50%; transform: translateY(-50%);\n      display: flex; align-items: center; gap: calc(9px * var(--pm-k));\n      box-sizing: border-box;\n      width: var(--d); height: var(--d);\n      padding: 0 0 0 calc((var(--d) - var(--bw) * 2 - 14px * var(--pm-k)) / 2);\n      overflow: hidden; white-space: nowrap;\n      background: var(--c-white); color: var(--true-black);\n      border: var(--bw) solid var(--true-black); border-radius: 999px;\n      font-family: var(--font-display); font-weight: 600;\n      font-size: var(--fs-xs);\n      letter-spacing: 0.08em; text-transform: uppercase; line-height: 1;\n      transition: width .4s cubic-bezier(.3,.7,.2,1), height .3s ease, padding .4s cubic-bezier(.3,.7,.2,1),\n                  background .25s ease, color .25s ease, border-color .25s ease;\n    }\n    .pm-btn .label { opacity: 0; transition: opacity .2s ease; }\n    .pm-btn .label::after { content: 'More'; }\n    details[open] > summary .pm-btn .label::after { content: 'Close'; }\n    .pm-btn .ico {\n      position: relative; flex: none;\n      width: calc(14px * var(--pm-k)); height: calc(14px * var(--pm-k));\n      transition: transform .35s ease;\n    }\n    .pm-btn .ico::before, .pm-btn .ico::after {\n      content: \"\"; position: absolute; left: 50%; top: 50%;\n      background: currentColor; transform: translate(-50%, -50%);\n    }\n    .pm-btn .ico::before { width: 100%; height: var(--bw); }\n    .pm-btn .ico::after  { width: var(--bw); height: 100%; }\n    details[open] > summary .pm-btn .ico { transform: rotate(45deg); }\n\n    /* Pill state: when the row is open, focused with the keyboard, or hovered */\n    details[open] > summary .pm-btn,\n    summary:focus-visible .pm-btn {\n      width: var(--pw); height: calc(38px * var(--pm-k)); padding-left: calc(16px * var(--pm-k));\n      background: var(--true-black); color: var(--c-white);\n    }\n    details[open] > summary .pm-btn .label,\n    summary:focus-visible .pm-btn .label { opacity: 1; transition-delay: .12s; }\n    @media (hover: hover) {\n      summary:hover .pm-btn {\n        width: var(--pw); height: calc(38px * var(--pm-k)); padding-left: calc(16px * var(--pm-k));\n        background: var(--true-black); color: var(--c-white);\n      }\n      summary:hover .pm-btn .label { opacity: 1; transition-delay: .12s; }\n    }\n\n    /* Accordions on a dark / coloured background: white version */\n    .sub-cat.sub-cat-block summary .pm-btn,\n    details.accordion-block > summary .pm-btn { background: transparent; color: var(--c-white); border-color: var(--c-white); }\n    .sub-cat.sub-cat-block[open] > summary .pm-btn,\n    details.accordion-block[open] > summary .pm-btn,\n    .sub-cat.sub-cat-block summary:focus-visible .pm-btn,\n    details.accordion-block > summary:focus-visible .pm-btn { background: var(--c-white); color: var(--true-black); }\n    @media (hover: hover) {\n      .sub-cat.sub-cat-block summary:hover .pm-btn,\n      details.accordion-block > summary:hover .pm-btn { background: var(--c-white); color: var(--true-black); }\n    }\n\n    /* Title wrapper: keeps the title on the left and prices on the right */\n    .pm-title {\n      flex: 1; min-width: 0;\n      display: flex; align-items: center; justify-content: space-between; gap: 10px;\n    }\n    summary.pm-ready { justify-content: flex-start; align-items: center; }\n    summary.pm-ready:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }\n    details.accordion-block > summary.group-head.pm-ready { padding-right: 32px; }\n    details.accordion-block > summary.group-head.pm-ready::after { content: none; }\n\n    /* Lines that don't open (e.g. PPM) keep their title aligned with the others */\n    .included-line::before {\n      content: ''; flex: none; width: calc(112px * 0.625); margin-right: 14px; /* 4px + the row's 10px gap */\n    }\n\n    @media (prefers-reduced-motion: reduce) {\n      .pm-btn, .pm-btn .ico, .pm-btn .label { transition: none; }\n    }\n  <\/style>\n\n  <script>\n  (function () {\n    // Every accordion that had a small symbol (+, ×, ✎) or a ▾ arrow gets the home-page circle\n    const summaries = document.querySelectorAll(\n      'details.sub-cat > summary, details.accordion-block > summary.group-head'\n    );\n    summaries.forEach(summary => {\n      if (summary.classList.contains('pm-ready')) return;\n      const old = summary.querySelector(':scope > .rm');\n      const isAccordionBlock = summary.parentElement.classList.contains('accordion-block');\n      if (!old && !isAccordionBlock) return;          // e.g. rows that are a checkbox, not a harmonica\n      if (old) old.remove();\n\n      // Everything that was in the row goes into one title block…\n      const title = document.createElement('span');\n      title.className = 'pm-title';\n      while (summary.firstChild) title.appendChild(summary.firstChild);\n\n      // …and the circle comes first, like in the home menu\n      const slot = document.createElement('span');\n      slot.className = 'pm-slot';\n      slot.setAttribute('aria-hidden', 'true');\n      slot.innerHTML = '<span class=\"pm-btn\"><span class=\"ico\"><\/span><span class=\"label\"><\/span><\/span>';\n\n      summary.appendChild(slot);\n      summary.appendChild(title);\n      summary.classList.add('pm-ready');\n    });\n  })();\n  <\/script>\n\n\n<script>\n  // PRESELECT_STUDIO — panier.html?studio=Studio%20Vid%C3%A9o%2000 opens with that studio chosen\n  window.addEventListener('load', function () {\n    var name = new URLSearchParams(location.search).get('studio');\n    if (!name) return;\n    var li = Array.prototype.find.call(document.querySelectorAll('.r-options li'), function (l) { return l.dataset.name === name; });\n    if (li) li.click();\n  });\n<\/script>\n\n<nav class=\"bl-nav\" id=\"blNav\" aria-label=\"Menu principal\" aria-hidden=\"true\">\n  <button type=\"button\" class=\"bl-nav-close\" id=\"blNavClose\" aria-label=\"Fermer le menu\">×<\/button>\n<div class=\"svc-list menu-svc-list\">\n<details class=\"svc\">\n        <summary>\n          <span class=\"svc-n\">01<\/span>\n          <span class=\"svc-t\"><span class=\"svc-eyebrow\">Découvrez notre<\/span><span class=\"svc-name\">Location de studio<\/span><\/span>\n          <span class=\"pm\" aria-hidden=\"true\"><span class=\"pm-ico\"><\/span><span class=\"pm-label\"><\/span><\/span>\n        <\/summary>\n        <div class=\"svc-body\">\n          <p>Découvrez notre large choix d'espaces de studio à louer : louez simplement l'espace, ou économisez avec nos formules qui incluent déjà l'équipement. Besoin de compléter votre équipe ? Notre Kollektiv s'en occupe.<\/p>\n          <div>\n            <div class=\"d-tags tag-cells\"><a href=\"studio_photo.html\">Studios photo<\/a><a href=\"studio_video.html\">Studios vidéo<\/a><a href=\"studio_green_screen.html\">Studios fond vert<\/a><a href=\"studio_casting.html\">Studios casting<\/a><a href=\"studio_webcast.html\">Studio webcast<\/a><a href=\"studio_appartement.html\">Studio Appartement<\/a><a href=\"coworking.html\">Coworking<\/a><i aria-hidden=\"true\"><\/i><i class=\"d-only\" aria-hidden=\"true\"><\/i><\/div>\n            <a href=\"bellano_studios.html\" class=\"btn btn-dark\">Découvrir la location de studio <span aria-hidden=\"true\">→<\/span><\/a>\n          <\/div>\n        <\/div>\n      <\/details>\n<details class=\"svc\">\n        <summary>\n          <span class=\"svc-n\">02<\/span>\n          <span class=\"svc-t\"><span class=\"svc-eyebrow\">Start-ups et entreprises<\/span><span class=\"svc-name\">Coaching de marque<\/span><\/span>\n          <span class=\"pm\" aria-hidden=\"true\"><span class=\"pm-ico\"><\/span><span class=\"pm-label\"><\/span><\/span>\n        <\/summary>\n        <div class=\"svc-body\">\n          <p>Repensez votre stratégie de marque et investissez plus intelligemment en marketing et en contenu, avec des coachs business de l'émission <em>Qui veut être mon associé ?<\/em> dans notre équipe de conseil.<\/p>\n          <div>\n            <div class=\"d-tags tag-cells\"><a href=\"bellano_coaching_de_marque.html#coach-lorenza\">Proposition de valeur<\/a><a href=\"bellano_coaching_de_marque.html#coach-lorenza\">Media training<\/a><a href=\"bellano_coaching_de_marque.html#coach-lorenza\">Positionnement et image de marque<\/a><a href=\"bellano_coaching_de_marque.html#coach-lorenza\">Étude de marché<\/a><a href=\"bellano_coaching_de_marque.html#coach-lorenza\">Stratégie de croissance et structuration<\/a><a href=\"bellano_coaching_de_marque.html#coach-emiliano\">IA ou conventionnel<\/a><\/div>\n            <a href=\"bellano_coaching_de_marque.html\" class=\"btn btn-dark\">Notre équipe au sein du Kollektiv <span aria-hidden=\"true\">→<\/span><\/a>\n          <\/div>\n        <\/div>\n      <\/details>\n<details class=\"svc\">\n        <summary>\n          <span class=\"svc-n\">03<\/span>\n          <span class=\"svc-t\"><span class=\"svc-eyebrow\">Tous types de<\/span><span class=\"svc-name\">Création de contenu<\/span><\/span>\n          <span class=\"pm\" aria-hidden=\"true\"><span class=\"pm-ico\"><\/span><span class=\"pm-label\"><\/span><\/span>\n        <\/summary>\n        <div class=\"svc-body\">\n          <p>Vous avez une idée et souhaitez en faire un projet. Notre infrastructure interne 360° la fait exister, en garantissant l'exécution la plus lean possible, du concept à la livraison. Nous sommes le partenaire idéal pour la création, la production et l'accompagnement des talents.<\/p>\n          <div>\n            <div class=\"d-tags tag-cells\"><a href=\"bellano_content_creation.html#cat-creator-content\">Contenu créateurs<\/a><a href=\"bellano_content_creation.html#cat-events\">Événementiel<\/a><a href=\"bellano_content_creation.html#cat-corporate\">Corporate<\/a><a href=\"bellano_content_creation.html#cat-ai-content\">Contenu IA<\/a><a href=\"bellano_content_creation.html#cat-advertising\">Publicité<\/a><a href=\"bellano_content_creation.html#cat-beauty\">Beauté<\/a><a href=\"bellano_content_creation.html#cat-fashion\">Mode<\/a><a href=\"bellano_content_creation.html#cat-music\">Musique<\/a><i class=\"d-only\" aria-hidden=\"true\"><\/i><\/div>\n            <a href=\"bellano_content_creation.html\" class=\"btn btn-dark\">Voir la production de contenu <span aria-hidden=\"true\">→<\/span><\/a>\n          <\/div>\n        <\/div>\n      <\/details>\n<details class=\"svc\">\n        <summary>\n          <span class=\"svc-n\">04<\/span>\n          <span class=\"svc-t\"><span class=\"svc-eyebrow\">L&#x27;humain d&#x27;abord<\/span><span class=\"svc-name\">Casting<\/span><\/span>\n          <span class=\"pm\" aria-hidden=\"true\"><span class=\"pm-ico\"><\/span><span class=\"pm-label\"><\/span><\/span>\n        <\/summary>\n        <div class=\"svc-body\">\n          <p>Parce qu'un casting, c'est plus qu'un visage : il commence par les personnes et se construit sur mesure, à travers une vraie rencontre.<\/p>\n          <div>\n            <div class=\"d-tags tag-cells\"><a href=\"bellano_casting.html#cat-tele\">Télé<\/a><a href=\"bellano_casting.html#cat-fiction\">Fiction<\/a><a href=\"bellano_casting.html#cat-pub\">Pub<\/a><a href=\"bellano_casting.html#cat-sauvage\">Sauvage<\/a><a href=\"bellano_casting.html#cat-digital\">Digital<\/a><i aria-hidden=\"true\"><\/i><\/div>\n            <a href=\"bellano_casting.html\" class=\"btn btn-dark\">Lancer un casting <span aria-hidden=\"true\">→<\/span><\/a>\n          <\/div>\n        <\/div>\n      <\/details>\n<details class=\"svc\">\n        <summary>\n          <span class=\"svc-n\">05<\/span>\n          <span class=\"svc-t\"><span class=\"svc-eyebrow\">Prestation / Événement<\/span><span class=\"svc-name\">Production<\/span><\/span>\n          <span class=\"pm\" aria-hidden=\"true\"><span class=\"pm-ico\"><\/span><span class=\"pm-label\"><\/span><\/span>\n        <\/summary>\n        <div class=\"svc-body\">\n          <p>Votre idée de projet doit prendre vie. Il vous faut quelqu'un pour trouver des lieux et gérer la logistique : réservation d'équipe, planning, espace, budget. On organise, vous dirigez.<\/p>\n          <div>\n            <div class=\"d-tags tag-cells\"><a href=\"bellano_production.html#prod-film\">Film<\/a><a href=\"bellano_production.html#prod-publicite\">Publicité<\/a><a href=\"bellano_production.html#prod-evenementiel\">Événementiel<\/a><\/div>\n            <a href=\"bellano_production.html\" class=\"btn btn-dark\">Parler production exécutive <span aria-hidden=\"true\">→<\/span><\/a>\n          <\/div>\n        <\/div>\n      <\/details>\n<details class=\"svc\">\n        <summary>\n          <span class=\"svc-n\">06<\/span>\n          <span class=\"svc-t\"><span class=\"svc-eyebrow\">Utilisez notre<\/span><span class=\"svc-name\">Kollektiv<\/span><\/span>\n          <span class=\"pm\" aria-hidden=\"true\"><span class=\"pm-ico\"><\/span><span class=\"pm-label\"><\/span><\/span>\n        <\/summary>\n        <div class=\"svc-body\">\n          <p>Vous envisagez de travailler avec nous sur un projet ? Vous voudrez savoir qui compose notre équipe et qui pourrait vous correspondre. Choisissez parmi des techniciens et des talents soigneusement sélectionnés, directement dans notre réseau interne de créatifs indépendants de confiance.<\/p>\n          <div>\n            <div class=\"d-tags tag-cells\"><a href=\"kollektiv-cards.html#cat-casting-director\">Directeur de casting<\/a><a href=\"kollektiv-cards.html#cat-art-director\">Directeur artistique<\/a><a href=\"kollektiv-cards.html\">Consultant média<\/a><a href=\"kollektiv-cards.html#cat-video-technician\">Techniciens vidéo<\/a><a href=\"kollektiv-cards.html#cat-director\">Réalisateurs<\/a><a href=\"kollektiv-cards.html#cat-photographer\">Photographes<\/a><a href=\"kollektiv-cards.html#cat-producer\">Producteurs<\/a><a href=\"kollektiv-cards.html\">Plus<\/a><i class=\"d-only\" aria-hidden=\"true\"><\/i><\/div>\n            <a href=\"kollektiv-cards.html\" class=\"btn btn-dark\">Rencontrer le Kollektiv <span aria-hidden=\"true\">→<\/span><\/a>\n          <\/div>\n        <\/div>\n      <\/details>\n<\/div>\n  <a href=\"bellano_home_main.html\" class=\"bl-nav-home\">← Retour à l'accueil<\/a>\n<\/nav>\n<script>\n(function(){\n  var nav=document.getElementById('blNav'), btn=document.querySelector('.menu-icon'), close=document.getElementById('blNavClose');\n  if(!nav||!btn) return;\n  btn.setAttribute('role','button'); btn.setAttribute('tabindex','0'); btn.setAttribute('aria-label','Ouvrir le menu');\n  function open(){ nav.classList.add('open'); nav.setAttribute('aria-hidden','false'); }\n  function shut(){ nav.classList.remove('open'); nav.setAttribute('aria-hidden','true'); }\n  btn.addEventListener('click',open);\n  btn.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } });\n  close.addEventListener('click',shut);\n  document.addEventListener('keydown',function(e){ if(e.key==='Escape') shut(); });\n})();\n<\/script>\n\n<script>\n/* BELLANO — every harmonica (details/summary) uses the same \"Plus\" circle as the home page */\n(function () {\n  var GLYPH = /^[▾▲▼▴+×✎]$/;   /* ▾ ▲ ▼ ▴ + × ✎ */\n  function lum(el) {\n    var m = getComputedStyle(el).color.match(/\\d+(\\.\\d+)?/g);\n    if (!m) return 0;\n    return (0.2126 * m[0] + 0.7152 * m[1] + 0.0722 * m[2]) / 255;\n  }\n  function makeSlot() {\n    var s = document.createElement('span');\n    s.className = 'pm-slot';\n    s.setAttribute('aria-hidden', 'true');\n    s.innerHTML = '<span class=\"pm-btn\"><span class=\"ico\"><\/span><span class=\"label\"><\/span><\/span>';\n    return s;\n  }\n  document.querySelectorAll('details > summary').forEach(function (sum) {\n    var slot = sum.querySelector('.pm-slot');\n    if (!slot) {\n      var icons = Array.prototype.filter.call(\n        sum.querySelectorAll('.chev, .plus, .pt-arrow, .mo-arrow, .rm'),\n        function (el) { return el.closest('summary') === sum && GLYPH.test(el.textContent.trim()); });\n      if (!icons.length) return;\n      slot = makeSlot();\n      var host = icons[0].closest('.learn-more, .pack-toggle');\n      icons.forEach(function (el) { if (!host || !host.contains(el)) el.remove(); });\n      if (host && sum.contains(host)) {\n        host.replaceWith(slot);                       /* inline \"learn more\" toggles */\n      } else {\n        var title = document.createElement('span');   /* row toggles: circle first, like the home menu */\n        title.className = 'pm-title';\n        while (sum.firstChild) title.appendChild(sum.firstChild);\n        sum.appendChild(slot);\n        /* the pill already says Plus / Moins: drop a generic \"En savoir plus\" next to it */\n        if (/^(en savoir plus|learn more|lire la suite|read more)$/i.test(title.textContent.replace(/\\s+/g, ' ').trim())) {\n          sum.classList.add('pm-solo');\n        } else {\n          sum.appendChild(title);\n        }\n        sum.classList.add('pm-ready');\n        if (!/flex/.test(getComputedStyle(sum).display)) sum.style.display = 'flex';\n      }\n    }\n    if (lum(slot.parentElement) > 0.6) slot.classList.add('pm-light');\n  });\n})();\n<\/script>\n<script>\n(function(){var bar=document.querySelector('.topbar');if(!bar)return;var on=false,tick=false;\nfunction upd(){tick=false;var y=window.scrollY||0;if(!on&&y>80){on=true;bar.classList.add('is-compact');}else if(on&&y<20){on=false;bar.classList.remove('is-compact');}}\nwindow.addEventListener('scroll',function(){if(!tick){tick=true;requestAnimationFrame(upd);}},{passive:true});upd();})();\n<\/script>\n<\/body>\n<\/html>\n"</script>
<script type="application/json" id="bl-src-en">"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta name=\"robots\" content=\"noindex, nofollow\">\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Booking — Kollektiv<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&family=Barlow+Condensed:wght@300;400;500;600;700&family=Bebas+Neue&display=swap\" rel=\"stylesheet\">\n<style>\n  /* ======================================================\n     BELLANO — SHARED DESIGN TOKENS (single source of truth)\n     ====================================================== */\n  :root{\n    /* neutrals */\n    --c-black:      #111111;\n    --c-black-soft: #2a2a2a;\n    --c-body:       #5c5c5c;\n    --c-grey:       #9c9892;\n    --c-line-strong:#cccccc;\n    --c-line:       #e2e0db;\n    --c-surface:    #f2f1ee;\n    --c-white:      #ffffff;\n    /* brand */\n    --c-gold:       #e8c234;\n    --c-frame:      #dcc061;\n    --c-blue:       #1f4399;\n    --c-rust:       #9f3a25;\n    --c-green:      #2f7a3f;\n    /* fonts */\n    --font-body:    'Barlow', Arial, sans-serif;\n    --font-display: 'Barlow Condensed', Arial, sans-serif;\n    --font-logo:    'Bebas Neue', Arial, sans-serif;\n    /* type scale — the only font sizes used on the site */\n    --fs-xs:  11px;\n    --fs-sm:  13px;\n    --fs-md:  16px;\n    --fs-lg:  20px;\n    --fs-xl:  26px;\n    --fs-2xl: 34px;\n    --fs-3xl: 44px;\n    --fs-4xl: 64px;\n  }\n\n\n  /* ======================================================\n     DESIGN TOKENS — identiques au site (page studio)\n     ====================================================== */\n  :root{\n    --black:  var(--c-rust);\n    --true-black: var(--c-black);\n    --grey:   var(--c-grey);\n    --rust:   var(--c-rust);\n    --blue:   var(--c-blue);\n    --gold:   var(--c-gold);\n    --bg:     var(--c-white);\n    --ink:    var(--c-black);\n    --body-copy: var(--c-body);\n    --max-w:  1200px;\n    --green:  var(--c-green);\n\n    /* ---- version \"légère\" : fond blanc + typo en couleur + petit liseré\n       latéral comme accent (pas d'aplat de couleur pâle en fond) ---- */\n    --line:   var(--c-line);\n    --line-soft: var(--c-line);\n    --muted:  var(--c-grey);\n    --radius: 6px;\n    --shadow-sm: 0 1px 3px rgba(17,17,17,0.08);\n    --shadow-md: 0 10px 28px rgba(17,17,17,0.08);\n  }\n\n  * { box-sizing: border-box; }\n  html, body {\n    margin: 0;\n    padding: 0;\n    background: var(--bg);\n    color: var(--ink);\n    font-family: var(--font-body);\n  }\n  img { max-width: 100%; display: block; }\n  .wrap {\n    max-width: var(--max-w);\n    margin: 0 auto;\n    padding: 0 40px;\n  }\n\n  .section-title {\n    font-family: var(--font-body);\n    font-weight: 400;\n    font-size: var(--fs-xl);\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n    color: var(--ink);\n    margin: 0;\n  }\n\n  /* ======================================================\n     HEADER — identique au site\n     ====================================================== */\n  .site-header {\n    padding: 40px 0 24px;\n    border-bottom: 1px solid var(--c-line);\n  }\n  .site-header .wrap {\n    display: grid;\n    grid-template-columns: 1fr auto 1fr;\n    align-items: end;\n    gap: 16px;\n  }\n  .logo-block { display: flex; align-items: flex-end; gap: 10px; }\n  .logo-block .ordinal {\n    font-family: var(--font-body);\n    font-weight: 700;\n    font-size: var(--fs-sm);\n    letter-spacing: 0.05em;\n    writing-mode: vertical-rl;\n    transform: rotate(180deg);\n    margin-bottom: 6px;\n    color: var(--rust);\n  }\n  .logo-stack .brand {\n    font-family: var(--font-logo);\n    font-size: 56px;\n    line-height: 1;\n    color: var(--ink);\n  }\n  .logo-stack .tagline {\n    display: inline-block;\n    background: var(--black);\n    color: var(--c-white);\n    font-family: var(--font-logo);\n    font-size: 16px;\n    line-height: 0.8;\n    letter-spacing: 0.06em;\n    padding: 6px 10px 4px;\n    margin-top: 5px;\n  }\n  .header-crumb {\n    font-family: var(--font-body);\n    font-weight: 400;\n    font-size: var(--fs-lg);\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n    text-align: center;\n    color: var(--ink);\n    white-space: nowrap;\n  }\n  .menu-icon {\n    justify-self: end;\n    display: flex;\n    flex-direction: column;\n    gap: 5px;\n    width: 26px;\n  }\n  .menu-icon span { display: block; height: 2px; background: var(--ink); }\n\n  /* ======================================================\n     BREADCRUMB / TITRE DE PAGE\n     ====================================================== */\n  .page-head {\n    max-width: var(--max-w);\n    margin: 0 auto;\n    padding: 48px 40px 0;\n  }\n  .page-head-row {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 16px;\n  }\n  .studio-preview-img {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    width: 320px;\n    height: 213px;\n    background: var(--c-line);\n    background-size: cover;\n    background-position: center;\n    flex-shrink: 0;\n  }\n  .studio-preview-label {\n    font-family: var(--font-display);\n    font-weight: 600;\n    font-size: var(--fs-sm);\n    letter-spacing: 0.08em;\n    text-transform: uppercase;\n    text-align: center;\n    color: var(--ink);\n  }\n  .page-head .eyebrow {\n    font-family: var(--font-display);\n    font-weight: 600;\n    font-size: var(--fs-sm);\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: var(--rust);\n    margin: 0 0 10px;\n  }\n  .page-head h1 {\n    font-family: var(--font-display);\n    font-size: var(--fs-3xl);\n    letter-spacing: 0.01em;\n    line-height: 1;\n    margin: 0 0 10px;\n    color: var(--ink); font-weight: 700; }\n  .page-head .sub {\n    font-family: var(--font-body);\n    font-weight: 300;\n    font-size: var(--fs-md);\n    color: var(--body-copy);\n    max-width: 70ch;\n  }\n\n  /* ======================================================\n     RÉCAPITULATIF DE RÉSERVATION — style spec-card\n     ====================================================== */\n  .booking-recap {\n    max-width: var(--max-w);\n    margin: 56px auto 0;\n    padding: 0 40px;\n  }\n  .recap-card {\n    background: var(--true-black);\n    color: var(--c-white);\n    display: flex;\n    flex-wrap: wrap;\n    align-items: stretch;\n    border-radius: var(--radius);\n  }\n  .recap-item {\n    position: relative;\n    flex: 1 1 180px;\n    padding: 22px 28px;\n    border-right: 1px solid rgba(255,255,255,0.15);\n  }\n  .recap-item:last-child { border-right: none; }\n  .recap-item .r-label {\n    font-family: var(--font-display);\n    font-weight: 400;\n    font-size: var(--fs-xs);\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: rgba(255,255,255,0.6);\n    margin: 0 0 6px;\n  }\n  .recap-item .r-value {\n    font-family: var(--font-body);\n    font-weight: 700;\n    font-size: var(--fs-md);\n    color: var(--c-white);\n    margin: 0;\n  }\n  .recap-item .r-value.big {\n    font-family: var(--font-display);\n    font-size: var(--fs-xl);\n    line-height: 1;\n    letter-spacing: 0.01em; font-weight: 700; }\n  .recap-item.edit {\n    flex: 0 0 auto;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    background: var(--gold);\n  }\n  .recap-item.edit a {\n    font-family: var(--font-display);\n    font-weight: 600;\n    font-size: var(--fs-sm);\n    letter-spacing: 0.1em;\n    text-transform: uppercase;\n    color: var(--c-black);\n    text-decoration: none;\n    white-space: nowrap;\n  }\n\n  /* ---- recap-item interactifs (studio / dates) ---- */\n  details.recap-item.as-details { padding: 0; cursor: pointer; }\n  details.recap-item.as-details summary {\n    list-style: none;\n    padding: 22px 28px;\n  }\n  details.recap-item.as-details summary::-webkit-details-marker { display: none; }\n  details.recap-item.as-details summary::marker { content: ''; }\n  details.recap-item.as-details summary::after {\n    content: '▾';\n    display: block;\n    margin-top: 6px;\n    font-size: var(--fs-xs);\n    color: rgba(255,255,255,0.35);\n  }\n  details.recap-item.as-details[open] summary::after { transform: rotate(180deg); }\n  details.recap-item.as-details[open] summary { background: rgba(255,255,255,0.08); }\n\n  .r-panel {\n    position: absolute;\n    top: 100%;\n    left: 0;\n    z-index: 30;\n    background: var(--c-white);\n    color: var(--c-black);\n    min-width: 340px;\n    border: 1px solid var(--line);\n    border-radius: var(--radius);\n    box-shadow: var(--shadow-md);\n  }\n  .r-options { list-style: none; margin: 0; padding: 8px 0; }\n  .r-options li {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 16px;\n    padding: 10px 22px;\n    font-family: var(--font-body);\n    font-weight: 500;\n    font-size: var(--fs-sm);\n    color: var(--ink);\n    cursor: pointer;\n  }\n  .r-options li:hover { background: var(--c-surface); }\n  .r-options li.is-active { color: var(--rust); font-weight: 700; }\n  .r-options .opt-price {\n    font-family: var(--font-body);\n    font-weight: 700;\n    font-size: var(--fs-sm);\n    color: var(--body-copy);\n    white-space: nowrap;\n  }\n  .r-options li.is-active .opt-price { color: var(--rust); }\n\n  .dates-panel { padding: 20px 22px 22px; min-width: 300px; }\n  .mini-cal-head {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    margin-bottom: 12px;\n  }\n  .mc-month {\n    font-family: var(--font-display);\n    font-weight: 600;\n    font-size: var(--fs-sm);\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n    color: var(--ink);\n  }\n  .mc-arrow { cursor: pointer; color: var(--body- ======== */\n  .pm-slot {\n    --pm-k: 0.625;\n    --d:  calc(34px * var(--pm-k));\n    --bw: max(1px, calc(1.5px * var(--pm-k)));\n    --pw: calc(112px * var(--pm-k));\n    --pm-ink: var(--c-black); --pm-paper: var(--c-white);\n    position: relative; flex: none; display: inline-block; vertical-align: middle;\n    width: var(--pw); height: var(--d); margin-right: 4px;\n  }\n  .pm-slot.pm-light { --pm-ink: var(--c-white); --pm-paper: var(--c-black); }\n  .pm-slot .pm-btn {\n    position: absolute; left: 0; top: 50%; transform: translateY(-50%);\n    display: flex; align-items: center; gap: calc(9px * var(--pm-k));\n    box-sizing: border-box; width: var(--d); height: var(--d);\n    padding: 0 0 0 calc((var(--d) - var(--bw) * 2 - 14px * var(--pm-k)) / 2);\n    overflow: hidden; white-space: nowrap;\n    background: transparent; color: var(--pm-ink);\n    border: var(--bw) solid var(--pm-ink); border-radius: 999px;\n    font-family: var(--font-display); font-weight: 600; font-size: var(--fs-xs);\n    letter-spacing: 0.08em; text-transform: uppercase; line-height: 1;\n    transition: width .4s cubic-bezier(.3,.7,.2,1), height .3s ease, padding .4s cubic-bezier(.3,.7,.2,1),\n                background .25s ease, color .25s ease, border-color .25s ease;\n  }\n  .pm-slot .pm-btn .label { opacity: 0; transition: opacity .2s ease; }\n  /* the pill must look the same everywhere: shield it from page rules on .label / .ico */\n  .pm-slot .pm-btn .label, .pm-slot .pm-btn .label::after {\n    display: inline !important; position: static !important; margin: 0 !important; padding: 0 !important;\n    font-family: var(--font-display) !important; font-weight: 600 !important; font-size: var(--fs-xs) !important;\n    line-height: 1 !important; letter-spacing: 0.08em !important; text-transform: uppercase !important;\n    color: inherit !important; background: none !important; writing-mode: horizontal-tb !important; transform: none !important;\n  }\n  .pm-slot .pm-btn .ico { width: calc( ppd-value\">250€<span class=\"ppd-unit\">/half-day<\/span><\/span>\n          <\/div>\n        <\/div>\n      <\/summary>\n      <div class=\"pack-body\">\n        <div class=\"pack-item\">\n          <p class=\"pi-title\">Fully equipped set<\/p>\n          <p class=\"pi-text\">Camera, computer, recording system and 60-inch monitor playback included.<\/p>\n        <\/div>\n        <div class=\"pack-item\">\n          <p class=\"pi-title\">Pre-set lighting<\/p>\n          <p class=\"pi-text\">Set-up already in place, on a concrete cyclorama or blue paper background.<\/p>\n        <\/div>\n        <div class=\"pack-item\">\n          <p class=\"pi-title\">Based on your needs<\/p>\n          <p class=\"pi-text\">Rental by the day or half-day.<\/p>\n        <\/div>\n      <\/div>\n    <\/details>\n\n    <details class=\"pack-block tone-grey\">\n      <summary>\n        <div class=\"pack-head-left\">\n          <p class=\"pack-title\">Free studio day package<\/p>\n          <label class=\"gh-select\"><input type=\"radio\" name=\"tier\" id=\"tier-studio-offert\" value=\"studio-offert\"> Choose this package<\/label>\n          <span class=\"pack-toggle\">Read more <span class=\"pt-arrow\">▲<\/span><\/span>\n        <\/div>\n        <div class=\"pack-price\">\n          <span class=\"pp-label\">4 days + 1 free<\/span>\n          <span class=\"pp-value\">1440€<\/span>\n        <\/div>\n      <\/summary>\n      <div class=\"pack-body\">\n        <div class=\"pack-item\">\n          <p class=\"pi-title\">4 days + 1 free<\/p>\n          <p class=\"pi-text\">Rent 4 days of casting studio and enjoy a free 5<sup>th<\/sup> day.<\/p>\n        <\/div>\n        <div class=\"pack-item\">\n          <p class=\"pi-title\">Total flexibility<\/p>\n          <p class=\"pi-text\">Spread the 5 days across the month as you like, subject to availability.<\/p>\n        <\/div>\n        <div class=\"pack-item\">\n          <p class=\"pi-title\">Same production, same team<\/p>\n          <p class= -col\">\n            <span class=\"ppd-label\">Full day<\/span>\n            <span class=\"ppd-value\">3600€<span class=\"ppd-unit\">/day<\/span><\/span>\n          <\/div>\n          <div class=\"ppd-col\">\n            <span class=\"ppd-label\">Half day<\/span>\n            <span class=\"ppd-value\">2900€<span class=\"ppd-unit\">/half-day<\/span><\/span>\n          <\/div>\n        <\/div>\n      <\/summary>\n      <div class=\"pack-body\">\n        <div class=\"pack-item\">\n          <p class=\"pi-title\">Two fully equipped sets<\/p>\n          <p class=\"pi-text\">4 Panasonic AW-HE40 cameras (TV set) + 2 Sony Alpha 7 III cameras (cyclorama), 5 Sennheiser microphones (MZH 3015 W + ME35) + shotgun/wireless mics on the cyclorama, vMix computer, encoding computer, and slide playback on 4 60-inch screens. Advanced split-screen, lower-third and motion-graphics options.<\/p>\n        <\/div>\n        <div class=\"pack-item\">\n          <p class=\"pi-title\">Number of speakers<\/p>\n          <p class=\"pi-text\">Max. 8: 2 presenters, with up to 6 simultaneous speakers.<\/p>\n        <\/div>\n        <div class=\"pack-item\">\n          <p class=\"pi-title\">Live duration<\/p>\n          <p class=\"pi-text\">Max. 2.5 hours per half-day.<\/p>\n        <\/div>\n        <div class=\"pack-item\">\n          <p class=\"pi-title\">Extras (paid option)<\/p>\n          <p class=\"pi-text\">Customization of the 2<sup>nd<\/sup> set, on quote.<\/p>\n        <\/div>\n      <\/div>\n    <\/details>\n\n    <div class=\"compare-col\">\n      <div class=\"compare-row\"><span class=\"cr-label\">Technicians<\/span><span class=\"cr-value\">2<\/span><\/div>\n      <div class=\"compare-row\"><span class=\"cr-label\">Cameras<\/span><span class=\"cr-value\">4 Panasonic AW-HE40 cameras (PTZ, AW-RP50 control)<\/span><\/div>\n      <div class=\"compare-row\"><span class=\"cr-label\">Microphones<\/span><span class=\"cr-value\">5 Sennheiser microphones (MZH 3015 W + ME35)<\/span><\/div>\n      <
