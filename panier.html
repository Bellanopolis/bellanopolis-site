lass=\"compare-col\">\n      <div class=\"compare-row\"><span class=\"cr-label\">Technicians<\/span><span class=\"cr-value\">3<\/span><\/div>\n      <div class=\"compare-row\"><span class=\"cr-label\">Cameras<\/span><span class=\"cr-value\">4 Panasonic AW-HE40 (TV set) + 2 Sony Alpha 7 III (cyclorama)<\/span><\/div>\n      <div class=\"compare-row\"><span class=\"cr-label\">Microphones<\/span><span class=\"cr-value\">5 Sennheiser (MZH 3015 W + ME35) + shotgun/wireless on cyclorama<\/span><\/div>\n      <div class=\"compare-row cr-highlight\"><span class=\"cr-label\">Control <span class=\"cr-tag\">Upgrade<\/span><\/span><span class=\"cr-value\"><mark>vMix computer<\/mark> — graphic overlays &amp; animations<\/span><\/div>\n      <div class=\"compare-row\"><span class=\"cr-label\">On-set backdrop screens<\/span><span class=\"cr-value\">3 60-inch screens<\/span><\/div>\n      <div class=\"compare-row\"><span class=\"cr-label\">Playback screens<\/span><span class=\"cr-value\">2 40-inch screens<\/span><\/div>\n      <div class=\"compare-row\"><span class=\"cr-label\">Speakers<\/span><span class=\"cr-value\">Max. 8 (2 presenters + 6 simultaneous)<\/span><\/div>\n      <div class=\"compare-row\"><span class=\"cr-label\">Live duration<\/span><span class=\"cr-value\">Max. 2.5h / half-day<\/span><\/div>\n    <\/div>\n\n  <\/div>\n\n  <!-- ---- CATÉGORIES CASTING (visibles uniquement pour Studio Casting) ---- -->\n  <div class=\"pack-section\" id=\"casting-extra-categories\" style=\"display:none;\">\n\n    <details class=\"sub-cat sub-cat-block\">\n      <summary>\n        <label class=\"gh-select inline-check\"><input type=\"checkbox\" class=\"opt-check\" data-price=\"100\" data-label=\"Video call back with director\"> Video call back with director<\/label>\n        <div class=\"sc-right\">\n          <span class=\"sc-price\">+100€<\/span>\n          <span class=\"rm\">+<\/span>\n        <\/div>\n      <\/summary>\n      <div class=\"pack-body plain-body\">\n        <div clas n class=\"red-bar\" aria-hidden=\"true\"><\/span><\/div>\n<\/footer>\n\n  <script>\n    let selectedStart = 14;\n    let selectedEnd = 16; // plage par défaut (14 → 16 sept.), modifiable en cliquant sur le calendrier\n    const NU_DISCOUNT = 0.15;\n\n    // Jours du calendrier (statique, September 2026) tombant un week-end.\n    // Aucun jour férié en septembre en France — le tableau reste prêt à en recevoir.\n    const WEEKEND_DAYS = [4, 5, 11, 12, 18, 19, 25, 26];\n    const HOLIDAY_DAYS = [];\n    const WEEKEND_HOLIDAY_SURCHARGE = 110;\n\n    function getWeekendHolidayDaysCount() {\n      const start = selectedStart;\n      const end = selectedEnd || selectedStart;\n      let count = 0;\n      for (let d = start; d <= end; d++) {\n        if (WEEKEND_DAYS.includes(d) || HOLIDAY_DAYS.includes(d)) count++;\n      }\n      return count;\n    }\n\n    const summaryList = document.getElementById('summary-lines');\n    const emptyNote = document.getElementById('empty-note');\n    const totalValue = document.getElementById('total-value');\n    const totalValueVat = document.getElementById('total-value-vat');\n    const VAT_RATE = 0.20;\n    const billingSummaryList = document.getElementById('billing-summary-lines');\n    const billingTotalValue = document.getElementById('billing-total-value');\n    const billingTotalValueVat = document.getElementById('billing-total-value-vat');\n    const tierRadios = document.querySelectorAll('input[name=\"tier\"]');\n    const optChecks = document.querySelectorAll('.opt-check');\n\n    function formatEuro(n) {\n      return (n % 1 === 0 ? n : n.toFixed(2)) + '€';\n    }\n\n    function getNumDays() {\n      return selectedEnd ? (selectedEnd - selectedStart + 1) : 1;\n    }\n\n    function renderCalendarSelection() {\n      document.querySelectorAll('.mc-day').forEach(day => {\n        const d = parseInt(day.dataset.day, 10);\n        day.classList.remove('in-range');\n        if (selectedEnd) {\n          if (d >= selectedStart && d <= selectedEnd) day.classList.add('in-range');\n        } else if (d === selectedStart) {\n          day.classList.add('in-range');\n        }\n      });\n\n      const datesValue = document.querySelector('.dates-panel').closest('details').querySelector('.r-value');\n      datesValue.textContent = selectedEnd\n        ? `${selectedStart} → ${selectedEnd} Sept. 2026`\n        : `${selectedStart} Sept. 2026`;\n    }\n\n    function handleDayClick(e) {\n      const d = parseInt(e.currentTarget.dataset.day, 10);\n      if (selectedStart === null || selectedEnd !== null) {\n        selectedStart = d;\n        selectedEnd = null;\n      } else if (d < selectedStart) {\n        selectedEnd = selectedStart;\n        selectedStart = d;\n      } else if (d === selectedStart) {\n        selectedEnd = null;\n      } else {\n        selectedEnd = d;\n      }\n      renderCalendarSelection();\n      recompute();\n    }\n\n    function getStudioRate() {\n      const activeLi = document.querySelector('.r-options li.is-active');\n      const heures = document.querySelector('input[name=\"heures-jour\"]:checked');\n      const isDemi = heures && heures.value === 'demi';\n      const dayRate = activeLi ? parseFloat(activeLi.dataset.day) : NaN;\n      const halfRate = activeLi ? parseFloat(activeLi.dataset.half) : NaN;\n      return {\n        dayRate: isNaN(dayRate) ? null : dayRate,\n        halfRate: isNaN(halfRate) ? null : halfRate,\n        rate: isNaN(isDemi ? halfRate : dayRate) ? null : (isDemi ? halfRate : dayRate),\n        isDemi,\n        studioName: activeLi ? activeLi.dataset.name : 'Studio'\n      };\n    }\n\n    function hasExtraHalf() {\n      const cb = document.getElementById('extra-half-day');\n      return !!(cb && cb.checked);\n    }\n\n    function getTotalDaysLabel() {\n      const total = getNumDays() + (hasExtraHalf() ? 0.5 : 0);\n      return total % 1 === 0 ? String(total) : String(total).replace('.', ',');\n    }\n\n    function getSelectedTier() {\n      const checked = document.querySelector('input[name=\"tier\"]:checked');\n      return checked ? checked.value : 'pack';\n    }\n\n    function getActiveRates() {\n      const tier = getSelectedTier();\n      const { studioName: currentStudio } = getStudioRate();\n      const isFondVertStudio = (currentStudio === 'Studio Green Screen 00' || currentStudio === 'Studio Green Screen 01');\n      if (tier === 'prelit') {\n        return isFondVertStudio\n          ? { dayRate: 1450, halfRate: 1205, studioName: 'Pre-lit studio' }\n          : { dayRate: 1350, halfRate: 1120, studioName: 'Pre-lit studio' };\n      }\n      const { dayRate, halfRate, studioName } = getStudioRate();\n      return { dayRate, halfRate, studioName };\n    }\n\n    function computeBasePrice() {\n      const tier = getSelectedTier();\n      const { studioName: currentStudio2 } = getStudioRate();\n      const isFondVertStudio2 = (currentStudio2 === 'Studio Green Screen 00' || currentStudio2 === 'Studio Green Screen 01');\n      if (tier === 'cleenmain') {\n        if (isPhotoStudio()) {\n          let photoPrice = PHOTO_TURNKEY_DAY_PRICE * getNumDays();\n          if (hasExtraHalf()) photoPrice += PHOTO_TURNKEY_DAY_PRICE / 2;   // demi-journée en plus = ½ jour\n          return photoPrice;\n        }\n        const tkDay = isFondVertStudio2 ? 2370 : 2200;\n        return tkDay * getNumDays() + (hasExtraHalf() ? tkDay / 2 : 0);   // demi-journée en plus = ½ jour\n      }\n      if (tier === 'studio-offert') return 1440;\n      if (tier === 'casting-long') return 700;\n      if (tier === 'juste-espace') {\n        const { isDemi } = getStudioRate();\n        return (isDemi ? 250 : 360) * getNumDays() + (hasExtraHalf() ? 250 : 0);\n      }\n\n      const WEBCAST_RATES = {\n        'webcast-simplifie': { day: 2400, half: 1700 },\n        'webcast-habille': { day: 3000, half: 2400 },\n        'webcast-dual': { day: 3600, half: 2900 },\n        'fittings-1': { day: 400, half: 250 },\n      };\n      if (WEBCAST_RATES[tier]) {\n        const { isDemi } = getStudioRate();\n        const r = WEBCAST_RATES[tier];\n        return (isDemi ? r.half : r.day) * getNumDays() + (hasExtraHalf() ? r.half : 0);\n      }\n\n      const { dayRate, halfRate } = getActiveRates();\n      const { isDemi } = getStudioRate();\n      const unitRate = isDemi ? halfRate : dayRate;\n      if (unitRate === null || unitRate === undefined || isNaN(unitRate)) return null;\n      let price = unitRate * getNumDays();\n      if (hasExtraHalf() && halfRate !== null && !isNaN(halfRate)) price += halfRate;\n      return price;\n    }\n\n    // ======================================================================\n    // PAGE PHOTO — mêmes contenus / comportements que la page photo autonome\n    // (Panier_Photo_only_37_53_). Tout ce bloc ne s'active que pour Studio\n    // Photo 00 / 01 (isPhotoStudio()). Pour les autres studios, rien ne\n    // change : les [data-ph] restent dans leur état d'origine.\n    // ======================================================================\n    const PHOTO_STUDIO_NAMES = ['Studio Photo 00', 'Studio Photo 01'];\n    function isPhotoStudio() {\n      const { studioName } = getStudioRate();\n      return PHOTO_STUDIO_NAMES.includes(studioName);\n    }\n\n    // Prix de la page Photo (Clé en main, Avec pack, Pré-lit)\n    const PHOTO_TURNKEY_DAY_PRICE = 2500;   // Clé en main / jour : carte, calcul du panier et pastille d'économie\n    const PHOTO_PACK_DAY_PRICE = 790;       // « Avec pack inclus » / jour (= tarif studio)\n    const PHOTO_STUDIO_INCLUDED = 790;      // « Studio 790 € »\n    const PHOTO_STUDIO_NAKED = 671;         // studio nu (cadres, drapeaux, grip, accessoires inclus, mais sans éclairage)\n    const PHOTO_PRELIT_RATES = { day: 1350, half: 1120 };\n    const PHOTO_PRELIT_PRELIGHT = 550, PHOTO_PRELIT_TECHNICIAN = 300;\n\n    // Devis 711rent 26-12734.02 (18.09.2026) : prix catalogue journaliers HT, avant la remise de 30 % de 711.\n    const SHOW_SUPPLIER_PRICES = true;\n    let lastIncludedFormula = null;   // formule dont le panneau « Already included » a été ouvert en dernier\n\n    const PHOTO_LIGHTING_ITEMS = [\n      { name: '1× Pocket Wizard',                        price: '≈ 15 €', amount: 15, note: '711: Broncolor RFS 2.1 Transceiver (radio trigger) — 15 €' },\n      { name: '1× Socoro 3200',                          price: '90 €',   amount: 90, note: '711: Broncolor Scoro S 3200 RFS2 — 90 €' },\n      { name: '1× Broncolor Grafit A4 Asymmetric 3200',  price: '60 €',   amount: 60, note: 'Price confirmed by Bellano (not in the 711 quote)' },\n      { name: '3× Broncolor Flashheads',                 price: '69 €',   amount: 69, note: '711: Broncolor Pulso G flash head — 3 × 23 €' },\n      { name: '1× Octalight 5ft / 150cm',                price: '45 €',   amount: 45, note: 'Price confirmed by Bellano (711 Octabox 5, 150 cm: 45 €)' },\n      { name: '1× Softbox 30x120cm',                     price: '25 €',   amount: 25, note: 'Price confirmed by Bellano: 25 €/day (not in the 711 quote)' },\n      { name: '1× Softbox 60x100cm',                     price: '25 €',   amount: 25, note: 'Price confirmed by Bellano: 25 €/day (not in the 711 quote)' },\n      { name: '4× White Umbrellas (M)',                  price: '≈ 60 €', amount: 60, note: '711: medium silver umbrella 110 cm — 4 × 15 € (medium white umbrella, Matphoto: 15 € each)' },\n      { name: '1× Beauty Dish (White, 2 Grids)',         price: '65 €',   amount: 65, note: 'Price confirmed by Bellano: beauty dish 40 € + honeycomb grid 25 €/day (not in the 711 quote)' },\n      { name: '2× Broncolor P45 (Standard Reflectors)',  price: 'incl.',  amount: 0,  note: '711: standard Broncolor P70 reflector — supplied with the Pulso G heads at 0 €' },\n      { name: '1× Flash Extension Cable (5m)',           price: '8 €',    amount: 8,  note: '711: 5m Broncolor flash head extension cable — 8 €' }\n    ];\n\n    const PHOTO_GRIP_ITEMS = [\n      { name: '3× C-Stand 40\"',                      price: '30 €', amount: 30, note: 'No C-stand in the 711 quote. Closest stand: Manfrotto U126 on wheels — 3 × 10 €' },\n      { name: '2× Manfrotto 007CSU Stand',           price: '20 €', amount: 20, note: 'Not in the 711 quote. Closest: Manfrotto U126 on wheels — 2 × 10 €' },\n      { name: '1× Manfrotto Super Boom',             price: '61 €', amount: 61, note: '711: Manfrotto Mega Boom 425b (larger boom, 6–30 kg, includes sandbag) — 61 €. Probably overestimated' },\n      { name: '2× Manfrotto 1004 Stand',             price: '20 €', amount: 20, note: 'Not in the 711 quote. Closest: Manfrotto U126 on wheels — 2 × 10 € (the heavier Hi-Roller A3058 is 22 €)' },\n      { name: '1× Manfrotto Magic Arm',              price: '8 €',  amount: 8,  note: 'Not in the 711 quote. Closest: Avenger D400 Gobohead Big — 8 € (711 counted it at a 100% discount)' },\n      { name: '2× Avenger D520 40\" extension arms',  price: '16 €', amount: 16, note: 'Not in the 711 quote. Closest matching brand: Avenger D400 Gobohead Big — 2 × 8 €' },\n      { name: '4× Manfrotto 035 Super Clamp',        price: '16 €', amount: 16, note: '711: Manfrotto 035 Superclamp — 4 × 4 €' }\n    ];\n\n    const PHOTO_FRAMES_ITEMS = [\n      { name: '1× Diffusion Frame 120×120', price: '15 €',   amount: 15, note: 'Matphoto: 120 × 120 cm aluminum frame — 15 €/day' },\n      { name: '1× Diffusion Frame 90×90',   price: '12 €',   amount: 12, note: 'Matphoto: 90 × 90 cm aluminum frame — 12 €/day' },\n      { name: '2× Flags 90×60',        price: '≈ 24 €', amount: 24, note: 'Matphoto: Cucoloris M flag (60 × 90 cm) — 2 × 12 €/day (old listing, not re-checked; the 75×60 flag is 14 €)' },\n      { name: '1× Flag 46×61',         price: '11 €',   amount: 11, note: 'Matphoto: Flag S (45 × 60 cm) — 11 €/day' },\n      { name: '1× Flag 25×100',        price: '≈ 11 €', amount: 11, note: 'Matphoto: Cutter S flag (20 × 105 cm) — 11 €/day (old listing, not re-checked)' },\n      { name: '4× Polyboard 100×200',  price: '≈ 64 €', amount: 64, note: 'Estimate: no price at Matphoto or RVZ (RVZ price on request). Based on the Pixloc folding V-flat 1×2 m, from 16 €/day × 4' }\n    ];\n\n    // Grip, cadres/drapeaux et accessoires sont exactement les mêmes équipements — et les mêmes\n    // tarifs — pour un tournage vidéo que pour un tournage photo (voir PHOTO_GRIP_ITEMS /\n    // PHOTO_FRAMES_ITEMS ci-dessus, réutilisés tels quels pour la page vidéo).\n    // Seul l'éclairage change : tarifs Kollektiv dédiés à la page vidéo / fond vert.\n    const VIDEO_LIGHTING_ITEMS = [\n      { name: '1× Tungsten Fresnel 2KW with diffusion frame', price: '25 €', amount: 25, note: 'Kollektiv rate.' },\n      { name: '2× Godox LED MS60R/Bi',                            price: '70 €', amount: 70, note: 'Market rate: ≈35 €/unit × 2 (comparable to an Aputure 300D/300X — verified online).' },\n      { name: '1× Godox lantern',                       price: 'incl.', amount: 0, note: 'Supplied with the Godox LED MS60R/Bi.' },\n      { name: '1× Godox lightbox',                         price: 'incl.', amount: 0, note: 'Supplied with the Godox LED MS60R/Bi.' },\n      { name: '1× Godox Follow Spot Kit',                         price: 'incl.', amount: 0, note: 'Supplied with the Godox LED MS60R/Bi.' },\n      { name: '2× Kino Flow 4Bank 120 3200K or 5400K',            price: '80 €', amount: 80, note: 'Market rate: ≈40 €/unit × 2 (Direct Digital, Buffaloc — verified online).' },\n      { name: '5× 1.2 kW Cyc lights 3200K + Full C.T. Blue → 5600K',price: '75 €', amount: 75, note: 'Market rate: ≈15 €/unit × 5 (comparable to a Blonde/Redhead 1-1.2kW — verified online).' }\n    ];\n\n    function formatSectionTotal(n) {\n      return Math.round(n) + '€';\n    }\n    function photoSum(items) { return items.reduce((t, i) => t + i.amount, 0); }\n\n    // Pastille « ✓ Already included » + montant (Bebas Neue) dans l'en-tête de catégorie.\n    // En Pré-lit, ce matériel est déjà compris dans le prix du studio : la pastille suffit, sans montant à côté.\n    function sectionTotalHtml(amount) {\n      if (!SHOW_SUPPLIER_PRICES) return '';\n      if (amount === null) return '<span class=\"sc-included-tag\">Included<\/span>';\n      return '<span class=\"sc-included-tag\">Included<\/span><span class=\"sc-amount\">' + amount + '<\/span>';\n    }\n\n    function setSectionTotal(listEl, amount) {\n      const d = listEl.closest('details');\n      const t = d && d.querySelector(':scope > summary .sec-total');\n      if (t) t.innerHTML = sectionTotalHtml(amount);\n    }\n\n    function renderPricedLists(selector, items) {\n      const total = photoSum(items);\n      document.querySelectorAll(selector).forEach(el => {\n        el.classList.toggle('priced', SHOW_SUPPLIER_PRICES);\n        el.innerHTML = items.map(item => SHOW_SUPPLIER_PRICES\n          ? `<li title=\"${item.note.replace(/\"/g, '&quot;')}\"><span>${item.name}<\/span><span class=\"item-price\">${item.price}<\/span><\/li>`\n          : `<li>${item.name}<\/li>`\n        ).join('');\n        setSectionTotal(el, formatSectionTotal(total));\n      });\n      document.querySelectorAll('#included-photo-nu .src-note, #included-photo-pack .src-note').forEach(n => {\n        n.style.display = SHOW_SUPPLIER_PRICES ? '' : 'none';\n      });\n    }\n    function renderPhotoLists() {\n      renderPricedLists('#ph-lighting-list', PHOTO_LIGHTING_ITEMS);\n      renderPricedLists('.ph-grip-list', PHOTO_GRIP_ITEMS);\n      renderPricedLists('.ph-frames-list', PHOTO_FRAMES_ITEMS);\n    }\n\n    // Même logique que renderPricedLists(), mais pilotée par un booléen \"show\" explicite\n    // (au lieu du seul SHOW_SUPPLIER_PRICES global) : utilisé par la page vidéo, où le prix\n    // ne doit s'afficher que pour les studios Vidéo / Fond vert, pas pour les autres.\n    function setPricedSection(el, items, show) {\n      el.classList.toggle('priced', show);\n      el.innerHTML = items.map(item => show\n        ? `<li title=\"${item.note.replace(/\"/g, '&quot;')}\"><span>${item.name}<\/span><span class=\"item-price\">${item.price}<\/span><\/li>`\n        : `<li>${item.name}<\/li>`\n      ).join('');\n      const d = el.closest('details');\n      const t = d && d.querySelector(':scope > summary .sec-total');\n      if (t) t.innerHTML = show ? sectionTotalHtml(formatSectionTotal(photoSum(items))) : '';\n    }\n\n    // ======================================================================\n    // PAGE VIDÉO — même traitement que la page photo (prix par article, sous-totaux\n    // « Already included » et bloc Total / Notre offre), appliqué aux studios Vidéo et Fond\n    // vert. Grip, cadres/drapeaux et accessoires réutilisent les tarifs photo (mêmes\n    // équipements, mêmes prix) ; seul l'éclairage a son propre tarif (VIDEO_LIGHTING_ITEMS).\n    // ======================================================================\n    const VIDEO_STUDIO_NAMES = ['Studio Video 00', 'Studio Video 01'];\n    const FONDVERT_STUDIO_NAMES = ['Studio Green Screen 00', 'Studio Green Screen 01'];\n    function isVideoStudio() {\n      const { studioName } = getStudioRate();\n      return VIDEO_STUDIO_NAMES.includes(studioName) || FONDVERT_STUDIO_NAMES.includes(studioName);\n    }\n    function isFondVertStudioNow() {\n      const { studioName } = getStudioRate();\n      return FONDVERT_STUDIO_NAMES.includes(studioName);\n    }\n    const VIDEO_PRELIT_TECHNICIAN = 250;   // même valeur que le texte affiché sur la carte Pré-lit (page vidéo)\n    function getVideoTurnkeyDayPrice() {\n      return isFondVertStudioNow() ? 2370 : 2200;\n    }\n    function getVideoPrelitRates() {\n      return isFondVertStudioNow() ? { day: 1450, half: 1205 } : { day: 1350, half: 1120 };\n    }\n    // Studio \"nu\" (sans éclairage) : tarif studio − 15%, mêmes bases que la carte \"Nu (sans lumière)\".\n    function getVideoStudioNaked() {\n      const { dayRate } = getStudioRate();\n      if (dayRate === null || dayRate === undefined || isNaN(dayRate)) return 0;\n      return dayRate - Math.round(dayRate * NU_DISCOUNT);\n    }\n\n    // Grip / cadres : prix par article affichés uniquement pour les studios Vidéo / Fond vert\n    // (mêmes tarifs que la page Photo). Pour les autres studios (Webcast, Casting, Fittings),\n    // l'affichage reste inchangé (liste simple, sans prix).\n    function renderSharedIncludedLists() {\n      const show = isVideoStudio() && SHOW_SUPPLIER_PRICES;\n      document.querySelectorAll('.grip-list').forEach(el => setPricedSection(el, PHOTO_GRIP_ITEMS, show));\n      document.querySelectorAll('.frames-list').forEach(el => setPricedSection(el, PHOTO_FRAMES_ITEMS, show));\n      document.querySelectorAll('.grip-src-note, .frames-src-note').forEach(n => {\n        n.style.display = show ? '' : 'none';\n      });\n    }\n\n    // ---- Avec pack : studio nu + éclairage vs prix « Avec pack inclus » (même tarif studio) ----\n    // Construit les lignes du détail dépliable « See the market price breakdown » :\n    // Studio (prix plein, non barré) puis les catégories déjà incluses (barrées + pastille),\n    // Accessoires en dernier sans prix (toujours offert). Amounts = tarifs JOURNALIERS.\n    // Équipe incluse dans la formule Clé en main (mêmes tarifs que « Complete your team »,\n    // catégorie « Video Technician » par défaut) : un technicien polyvalent caméra/son, un\n    // opérateur caméra, un ingénieur du son et un assistant plateau.\n    const VIDEO_TURNKEY_CREW_ITEMS = [\n      { name: 'Versatile camera & sound technician', amount: 500 },\n      { name: 'Camera operator', amount: 350 },\n      { name: 'Sound engineer', amount: 400 },\n      { name: 'Set assistant', amount: 250 }\n    ];\n    function videoTurnkeyCrewTotal() {\n      return VIDEO_TURNKEY_CREW_ITEMS.reduce((t, i) => t + i.amount, 0);\n    }\n\n    function videoOfferRows(includeCrew) {\n      const rows = [\n        { label: 'Studio', amount: getVideoStudioNaked(), struck: false }\n      ];\n      if (includeCrew) rows.push({ label: 'Team included', amount: videoTurnkeyCrewTotal(), struck: true });\n      rows.push(\n        { label: 'Lighting', amount: photoSum(VIDEO_LIGHTING_ITEMS), struck: true },\n        { label: 'Frames, flags and poly board', amount: photoSum(PHOTO_FRAMES_ITEMS), struck: true },\n        { label: 'Grip', amount: photoSum(PHOTO_GRIP_ITEMS), struck: true },\n        { label: 'Accessories', amount: null, struck: false }\n      );\n      return rows;\n    }\n\n    // Remplit un bloc « Valeur marché / Prix » + badge d'économie + détail dépliable.\n    // idPrefix : 'vid-offer-pack' | 'vid-offer-prelit' | 'vid-offer-turnkey'.\n    function renderMarketOfferBox(idPrefix, show, marketValue, price, rows) {\n      const box = document.getElementById(idPrefix);\n      const visible = show && price !== null && price !== undefined && !isNaN(price);\n      if (box) box.hidden = !visible;\n      if (!visible) return;\n\n      const marketEl = document.getElementById(idPrefix + '-market');\n      const priceEl = document.getElementById(idPrefix + '-price');\n      const savingEl = document.getElementById(idPrefix + '-saving');\n      const listEl = document.getElementById(idPrefix + '-detail');\n\n      const saving = marketValue - price;\n      const pct = marketValue > 0 ? Math.floor(saving / marketValue * 100) : 0;\n      const showSaving = saving > 0 && pct > 0;\n      const offEl = document.getElementById(idPrefix + '-off');\n      // même présentation que les totaux Photo : valeur barrée, prix HT, pastilles « You save » / « % OFF »\n      if (marketEl) marketEl.textContent = showSaving ? formatSectionTotal(marketValue) : '';\n      if (priceEl) priceEl.textContent = formatSectionTotal(price);\n      if (savingEl) savingEl.textContent = showSaving ? 'You save\\u00a0' + formatSectionTotal(saving) : '';\n      if (offEl) offEl.textContent = showSaving ? pct + '%\\u00a0OFF' : '';\n\n      if (listEl) {\n        listEl.innerHTML = rows.map(r => {\n          if (r.amount === null) {\n            return '<li><span>' + r.label + '<\/span><span class=\"mo-item-right\"><span class=\"sc-included-tag\">Included<\/span><\/span><\/li>';\n          }\n          if (r.struck) {\n            return '<li><span>' + r.label + '<\/span><span class=\"mo-item-right\"><span class=\"mo-item-price mo-struck\">' + formatSectionTotal(r.amount) + '<\/span><span class=\"sc-included-tag\">Included<\/span><\/span><\/li>';\n          }\n          return '<li><span>' + r.label + '<\/span><span class=\"mo-item-right\"><span class=\"mo-item-price\">' + formatSectionTotal(r.amount) + '<\/span><\/span><\/li>';\n        }).join('');\n      }\n    }\n\n    // ---- Avec pack : studio nu + éclairage vs prix « Avec pack inclus » (même tarif studio) ----\n    function renderVideoPackValue() {\n      const video = isVideoStudio();\n      const dailyValue = getVideoStudioNaked() + photoSum(VIDEO_LIGHTING_ITEMS);\n\n      // Pastille sur la carte formule : comparaison à l'unité (1 jour), fixe, indépendante des dates choisies\n      // — même principe que la pastille « Avec pack inclus » de la page Photo.\n      const { dayRate } = getStudioRate();\n      const unitValue = dailyValue;\n      const unitSaving = (dayRate !== null && dayRate !== undefined && !isNaN(dayRate)) ? unitValue - dayRate : 0;\n      const unitPct = unitValue > 0 ? Math.floor(unitSaving / unitValue * 100) : 0;\n      const packBadge = document.getElementById('vid-pack-saving-badge');\n      const packSaving = document.getElementById('vid-pack-saving');\n      if (packBadge) packBadge.innerHTML = unitPct + '%\\u00a0OFF';\n      if (packSaving) packSaving.hidden = !(video && SHOW_SUPPLIER_PRICES && unitSaving > 0);\n\n      const units = photoDayUnits();\n      const value = dailyValue * units;\n      const price = computeStudioPrice();\n      renderMarketOfferBox('vid-offer-pack', video && SHOW_SUPPLIER_PRICES, value, price, videoOfferRows(false));\n      recordSaving('video-pack', value, price);\n    }\n\n    // ---- Pré-lit : ½ journée pré-light + technicien + studio nu + éclairage + cadres + grip vs prix Pré-lit ----\n    function renderVideoPrelitValue() {\n      const video = isVideoStudio();\n      const { isDemi } = getStudioRate();\n      const rates = getVideoPrelitRates();\n      const dailyValue = getVideoStudioNaked() + photoSum(VIDEO_LIGHTING_ITEMS) + photoSum(PHOTO_FRAMES_ITEMS) + photoSum(PHOTO_GRIP_ITEMS);\n\n      // Pastille sur la carte formule : comparaison à l'unité (1,5 jour), fixe, indépendante des dates choisies\n      // — même principe que la pastille « Pré-lit » de la page Photo.\n      const unitValue = dailyValue + rates.half + VIDEO_PRELIT_TECHNICIAN;\n      const unitSaving = unitValue - rates.day;\n      const unitPct = unitValue > 0 ? Math.floor(unitSaving / unitValue * 100) : 0;\n      const badge = document.getElementById('vid-prelit-saving-badge');\n      const wrap = document.getElementById('vid-prelit-saving');\n      if (badge) badge.innerHTML = unitPct + '%\\u00a0OFF';\n      if (wrap) wrap.hidden = !(video && SHOW_SUPPLIER_PRICES && unitSaving > 0 && !isDemi);\n\n      const units = photoDayUnits();\n      const value = dailyValue * units + rates.half + VIDEO_PRELIT_TECHNICIAN;\n      let price = (isDemi ? rates.half : rates.day) * getNumDays();\n      if (hasExtraHalf()) price += rates.half;\n      renderMarketOfferBox('vid-offer-prelit', video && SHOW_SUPPLIER_PRICES, value, price, videoOfferRows(false));\n      recordSaving('video-prelit', value, price);\n    }\n\n    // ---- Clé en main : studio nu + équipe incluse + éclairage + cadres + grip vs prix Clé en main ----\n    function renderVideoTurnkeyValue() {\n      const video = isVideoStudio();\n      const dailyValue = getVideoStudioNaked() + videoTurnkeyCrewTotal() + photoSum(VIDEO_LIGHTING_ITEMS) + photoSum(PHOTO_GRIP_ITEMS) + photoSum(PHOTO_FRAMES_ITEMS);\n\n      // Pastille sur la carte formule : comparaison à l'unité (1 jour), fixe, indépendante des dates choisies\n      // — même principe que la pastille « Clé en main » de la page Photo.\n      const unitValue = dailyValue;\n      const unitPrice = getVideoTurnkeyDayPrice();\n      const unitSaving = unitValue - unitPrice;\n      const unitPct = unitValue > 0 ? Math.floor(unitSaving / unitValue * 100) : 0;\n      const card = document.getElementById('vid-cleenmain-saving');\n      if (card) {\n        document.getElementById('vid-cleenmain-saving-badge').innerHTML = unitPct + '%\\u00a0OFF';\n        card.hidden = !(video && SHOW_SUPPLIER_PRICES && unitSaving > 0);\n      }\n\n      const units = photoDayUnits();\n      const value = dailyValue * units;\n      const price = unitPrice * units;\n      renderMarketOfferBox('vid-offer-turnkey', video && SHOW_SUPPLIER_PRICES, value, price, videoOfferRows(true));\n      recordSaving('video-cleenmain', value, price);\n    }\n\n    function renderVideoValues() {\n      renderVideoPackValue();\n      renderVideoPrelitValue();\n      renderVideoTurnkeyValue();\n    }\n\n    // « Équipe et équipement de base inclus » (Clé en main) : total des data-amount des lignes\n    function renderPhotoCrewTotal() {\n      const list = document.querySelector('#ph-crew-turnkey .item-list');\n      if (!list) return;\n      const total = Array.from(list.querySelectorAll('[data-amount]')).reduce((s, li) => s + Number(li.dataset.amount), 0);\n      setSectionTotal(list, formatSectionTotal(total));\n    }\n\n    // Nombre de jours facturés (jours du calendrier + demi-journée en plus le cas échéant) — même\n    // base que celle utilisée par computeBasePrice() pour calculer le total réellement facturé.\n    function photoDayUnits() {\n      return getNumDays() + (hasExtraHalf() ? 0.5 : 0);\n    }\n\n    // Prix réellement facturé pour « Avec pack » / « Pré-lit », pour CE studio et CES dates,\n    // indépendamment de la formule actuellement cochée (utile pour prévisualiser une formule\n    // sans la sélectionner). Reprend exactement la même logique que computeBasePrice().\n    function photoPackPrice() {\n      const { dayRate, halfRate, isDemi } = getStudioRate();\n      const unitRate = isDemi ? halfRate : dayRate;\n      if (unitRate === null || unitRate === undefined || isNaN(unitRate)) return null;\n      let price = unitRate * getNumDays();\n      if (hasExtraHalf() && halfRate !== null && !isNaN(halfRate)) price += halfRate;\n      return price;\n    }\n    function photoPrelitPrice() {\n      const { isDemi } = getStudioRate();\n      const unitRate = isDemi ? PHOTO_PRELIT_RATES.half : PHOTO_PRELIT_RATES.day;\n      let price = unitRate * getNumDays();\n      if (hasExtraHalf()) price += PHOTO_PRELIT_RATES.half;\n      return price;\n    }\n\n    // ---- Clé en main : total inclus (PPM + studio + équipe/équipement + lumières + cadres + grip) vs prix Clé en main ----\n    function renderPhotoTurnkeyValue() {\n      const photo = isPhotoStudio();\n      const crewList = document.querySelector('#ph-crew-turnkey .item-list');\n      const crew = crewList ? Array.from(crewList.querySelectorAll('[data-amount]')).reduce((t, li) => t + Number(li.dataset.amount), 0) : 0;\n      const ppmRow = document.getElementById('ph-ppm-turnkey');\n      const ppm = ppmRow ? Number(ppmRow.dataset.amount) : 0;\n      // Studio, équipe, lumières, cadres et grip sont des tarifs JOURNALIERS ; seul le PPM (réunion\n      // unique) ne se répète pas chaque jour.\n      const dailyValue = PHOTO_STUDIO_NAKED + crew + photoSum(PHOTO_LIGHTING_ITEMS) + photoSum(PHOTO_GRIP_ITEMS) + photoSum(PHOTO_FRAMES_ITEMS);\n\n      // Pastille sur la carte formule : comparaison à l'unité (1 jour), fixe, indépendante des dates choisies.\n      const unitValue = ppm + dailyValue;\n      const unitSaving = unitValue - PHOTO_TURNKEY_DAY_PRICE;\n      const unitPct = Math.floor(unitSaving / unitValue * 100);\n      const card = document.getElementById('ph-cleenmain-saving');\n      if (card) {\n        document.getElementById('ph-cleenmain-saving-badge').innerHTML = unitPct + '%\\u00a0OFF';\n        card.hidden = !(photo && SHOW_SUPPLIER_PRICES && unitSaving > 0);\n      }\n\n      // Panneau « Already included » : reflète le nombre de jours (+ demi-journée) réellement sélectionnés\n      // dans le calendrier, et compare au prix qui sera vraiment facturé pour ces dates.\n      const units = photoDayUnits();\n      const value = ppm + dailyValue * units;\n      const price = PHOTO_TURNKEY_DAY_PRICE * units;   // = exactement le prix facturé (computeBasePrice)\n      recordSaving('photo-cleenmain', value, price);\n      const saving = value - price;\n      const pct = value > 0 ? Math.floor(saving / value * 100) : 0;\n\n      const totalRow = document.getElementById('ph-total-turnkey');\n      if (totalRow) {\n        document.getElementById('ph-total-turnkey-value').textContent = formatSectionTotal(value);\n        document.getElementById('ph-total-turnkey-price').textContent = formatSectionTotal(price);\n        document.getElementById('ph-total-turnkey-note').textContent = 'You save\\u00a0' + formatSectionTotal(saving);\n        document.getElementById('ph-total-turnkey-off').textContent = pct + '%\\u00a0OFF';\n      }\n    }\n\n    // ---- Avec pack : studio nu + éclairage vs prix « Avec pack inclus » ----\n    function renderPhotoPackValue() {\n      const photo = isPhotoStudio();\n      const lighting = photoSum(PHOTO_LIGHTING_ITEMS);\n      const dailyValue = PHOTO_STUDIO_NAKED + lighting;\n\n      // Pastille sur la carte formule : comparaison à l'unité (1 jour), fixe.\n      const unitValue = dailyValue;\n      const unitSaving = unitValue - PHOTO_PACK_DAY_PRICE;\n      const unitPct = Math.floor(unitSaving / unitValue * 100);\n      const packBadge = document.getElementById('ph-pack-saving-badge');\n      const packSaving = document.getElementById('ph-pack-saving');\n      if (packBadge) packBadge.innerHTML = unitPct + '%\\u00a0OFF';\n      if (packSaving) packSaving.hidden = !(photo && SHOW_SUPPLIER_PRICES && unitSaving > 0);\n\n      // Panneau « Already included » : reflète le nombre de jours (+ demi-journée) sélectionnés, comparé\n      // au prix réellement facturé pour ces dates (même tarif studio que « Nu »/« Avec pack »).\n      const units = photoDayUnits();\n      const value = dailyValue * units;\n      const price = photoPackPrice();\n      recordSaving('photo-pack', value, price);\n      const valueEl = document.getElementById('ph-total-pack-value');\n      const priceEl = document.getElementById('ph-total-pack-price');\n      const noteEl = document.getElementById('ph-total-pack-note');\n      if (valueEl) valueEl.textContent = formatSectionTotal(value);\n      if (priceEl && price !== null) priceEl.textContent = formatSectionTotal(price);\n      if (noteEl && price !== null) {\n        const saving = value - price;\n        const pct = value > 0 ? Math.floor(saving / value * 100) : 0;\n        noteEl.textContent = 'You save\\u00a0' + formatSectionTotal(saving);\n        const offEl = document.getElementById('ph-total-pack-off');\n        if (offEl) offEl.textContent = pct + '%\\u00a0OFF';\n      }\n    }\n\n    // ---- Pré-lit : ½ journée pré-light + technicien + studio vs prix Pré-lit ----\n    function renderPhotoPrelitValue() {\n      const photo = isPhotoStudio();\n      const { isDemi } = getStudioRate();\n      const dailyValue = PHOTO_STUDIO_NAKED + photoSum(PHOTO_LIGHTING_ITEMS) + photoSum(PHOTO_FRAMES_ITEMS) + photoSum(PHOTO_GRIP_ITEMS);\n      const eur = formatSectionTotal;\n\n      // Pastille sur la carte formule : comparaison à l'unité (1,5 jour), fixe, indépendante des dates choisies.\n      const unitValue = dailyValue + PHOTO_PRELIT_PRELIGHT + PHOTO_PRELIT_TECHNICIAN;\n      const unitSaving = unitValue - PHOTO_PRELIT_RATES.day;\n      const unitPct = Math.floor(unitSaving / unitValue * 100);\n      const badge = document.getElementById('ph-prelit-saving-badge');\n      const wrap = document.getElementById('ph-prelit-saving');\n      if (badge) badge.innerHTML = unitPct + '%\\u00a0OFF';\n      if (wrap) wrap.hidden = !(photo && unitSaving > 0 && !isDemi);\n\n      // Panneau « Already included » : le studio/lumières/cadres/grip sont journaliers (× jours sélectionnés),\n      // la ½ journée pré-light + le technicien sont une préparation unique (non répétée chaque jour).\n      const units = photoDayUnits();\n      const value = dailyValue * units + PHOTO_PRELIT_PRELIGHT + PHOTO_PRELIT_TECHNICIAN;\n      const price = photoPrelitPrice();   // = exactement le prix facturé (computeBasePrice)\n      recordSaving('photo-prelit', value, price);\n      const saving = value - price;\n      const pct = value > 0 ? Math.floor(saving / value * 100) : 0;\n\n      const valueEl = document.getElementById('ph-total-prelit-value');\n      if (valueEl) {\n        valueEl.textContent = eur(value);\n        document.getElementById('ph-total-prelit-price').textContent = eur(price);\n        document.getElementById('ph-total-prelit-note').textContent = 'You save\\u00a0' + eur(saving);\n        document.getElementById('ph-total-prelit-off').textContent = pct + '%\\u00a0OFF';\n      }\n    }\n\n    // Carte Pré-lit (photo) : prix total pour les jours réellement sélectionnés dans le calendrier\n    // (même logique que la carte « Avec pack inclus »), au lieu d'un prix figé à l'unité.\n    function updatePhotoPrelitPrice() {\n      const price = document.getElementById('ph-prelit-price');\n      if (price) {\n        const p = photoPrelitPrice();\n        price.innerHTML = formatEuro(p) + '<span class=\"gh-unit\">For ' + getTotalDaysLabel() + (getTotalDaysLabel() === '1' ? ' day' : ' days') + '<\/span>';\n      }\n    }\n\n    // Bascule les éléments propres à la page Photo (data-ph=\"only\") et masque ceux qu'elle remplace (data-ph=\"not\")\n    function applyPhotoMode() {\n      const photo = isPhotoStudio();\n      document.querySelectorAll('[data-ph=\"only\"]').forEach(el => { el.hidden = !photo; });\n      document.querySelectorAll('[data-ph=\"not\"]').forEach(el => { el.hidden = photo; });\n      // Sur la page Photo, seule la formule Clé en main a un onglet Équipe (comme sur la page autonome)\n      document.querySelectorAll('.ft-tab.ft-crew').forEach(btn => {\n        if (btn.dataset.formula !== 'cleenmain') btn.hidden = photo;\n      });\n    }\n\n    function renderPhotoPage() {\n      applyPhotoMode();\n      updatePhotoPrelitPrice();\n      renderPhotoLists();\n      renderPhotoCrewTotal();\n      renderPhotoTurnkeyValue();\n      renderPhotoPackValue();\n      renderPhotoPrelitValue();\n      // si un panneau « Already included » est ouvert et que l'on change de studio, on le réaffiche avec le bon contenu\n      if (lastIncludedFormula !== null) showIncludedFor(lastIncludedFormula);\n    }\n\n    const LIGHTING_DEFAULT = [\n      '1× Tungsten Fresnel 2KW with diffusion frame',\n      '2× Godox LED MS60R/Bi',\n      '1× Godox lantern',\n      '1× Godox lightbox',\n      '1× Godox Follow Spot Kit',\n      '2× Kino Flo 4Bank 120 3200K or 5400K',\n      '5× 1.2 kW Cyc lights 3200K + Full C.T. Blue → 5600K (+€20)'\n    ];\n    const LIGHTING_VIDEO = [\n      '1× Tungsten Fresnel 2KW with diffusion frame',\n      '2× Godox LED MS60R/Bi',\n      '1× Godox lantern',\n      '1× Godox lightbox',\n      '1× Godox Follow Spot Kit',\n      '2× Kino Flow 4Bank 120 3200K or 5400K',\n      '5× 1.2 kW Cyc lights 3200K + Full C.T. Blue → 5600K'\n    ];\n    const LIGHTING_PHOTO = [\n      '1× Pocket Wizard',\n      '1× Socoro 3200',\n      '1× Broncolor Grafit A4 Asymmetric 3200',\n      '3× Broncolor Flashheads',\n      '1× Octalight 5ft / 150cm',\n      '1× Softbox 30x120cm',\n      '1× Softbox 60x100cm',\n      '4× White Umbrellas (M)',\n      '1× Beauty Dish (White, 2 Grids)',\n      '2× Broncolor P45 (Standard Reflectors)',\n      '1× Flash Extension Cable (5m)'\n    ];\n\n    function renderLightingList() {\n      const { studioName } = getStudioRate();\n      const isVideo = (studioName === 'Studio Video 00' || studioName === 'Studio Video 01' || studioName === 'Studio Green Screen 00' || studioName === 'Studio Green Screen 01');\n      const isPhoto = (studioName === 'Studio Photo 00' || studioName === 'Studio Photo 01');\n      const isFondVertStudio = (studioName === 'Studio Green Screen 00' || studioName === 'Studio Green Screen 01');\n      const fondVertLine = document.getElementById('fondvert-included');\n      if (fondVertLine) fondVertLine.style.display = isFondVertStudio ? '' : 'none';\n      const packSelectRow = document.getElementById('pack-select-row');\n      if (packSelectRow) packSelectRow.style.display = isFondVertStudio ? 'none' : '';\n      // « Lumières » apparaît dans Already included pour Pack, Pré-lit et Clé en main\n      // (même équipement), avec la liste spécifique au type de studio (photo / vidéo).\n      // Sur la page vidéo, comme sur la page photo : prix par article + sous-total de catégorie.\n      document.querySelectorAll('.lighting-list').forEach(el => {\n        const subCat = el.closest('.sub-cat');\n        if (isVideo) {\n          setPricedSection(el, VIDEO_LIGHTING_ITEMS, SHOW_SUPPLIER_PRICES);\n          if (subCat) subCat.style.display = '';\n        } else if (isPhoto) {\n          el.classList.remove('priced');\n          el.innerHTML = LIGHTING_PHOTO.map(item => `<li>${item}<\/li>`).join('');\n          const d = el.closest('details');\n          const t = d && d.querySelector(':scope > summary .sec-total');\n          if (t) t.innerHTML = '';\n          if (subCat) subCat.style.display = '';\n        } else {\n          if (subCat) subCat.style.display = 'none';\n        }\n      });\n      document.querySelectorAll('.lighting-src-note').forEach(n => {\n        n.style.display = (isVideo && SHOW_SUPPLIER_PRICES) ? '' : 'none';\n      });\n    }\n\n    const OVERTIME_DEFAULT = [\n      { price: 100, label: '1 hour announced in advance', text: '100 €' },\n      { price: 180, label: '1 hour announced on the day of the rental', text: '180 €' },\n      { price: 220, label: '1 hour between 10pm and 7am', text: '220 €' },\n    ];\n    const OVERTIME_FITTINGS = [\n      { price: 40, label: '1 hour announced in advance', text: '40 €' },\n      { price: 80, label: '1 hour announced on the day of the rental', text: '80 €' },\n      { price: 100, label: '1 hour between 10pm and 7am', text: '100 €' },\n    ];\n\n    function renderOvertimeList() {\n      const { studioName } = getStudioRate();\n      const isFittingsStudio = (studioName === 'Studio Fittings');\n      const list = document.getElementById('overtime-list');\n      if (!list) return;\n      const rates = isFittingsStudio ? OVERTIME_FITTINGS : OVERTIME_DEFAULT;\n      list.innerHTML = rates.map(r =>\n        `<li><label><input type=\"checkbox\" class=\"opt-check\" data-price=\"${r.price}\" data-label=\"${r.label}\"><span>${r.label}<\/span><span class=\"item-price\">${r.text}<\/span><\/label><\/li>`\n      ).join('');\n    }\n\n    function renderTeamList() {\n      const { studioName } = getStudioRate();\n      const isFittingsStudio = (studioName === 'Studio Fittings');\n      const list = document.getElementById('team-list');\n      if (!list) return;\n      list.querySelectorAll('li').forEach(li => {\n        const chk = li.querySelector('.opt-check');\n        const isAssistantPlateau = chk && chk.dataset.label === 'Set assistant';\n        li.style.display = (isFittingsStudio && !isAssistantPlateau) ? 'none' : '';\n      });\n    }\n\n    function renderStudioListPrices() {\n      document.querySelectorAll('.r-options li').forEach(li => {\n        const dayRate = parseFloat(li.dataset.day);\n        const halfRate = parseFloat(li.dataset.half);\n        const priceSpan = li.querySelector('.opt-price');\n        if (li.dataset.name === 'Studio Webcast') {\n          priceSpan.textContent = 'from 1700€';\n        } else if (isNaN(dayRate) && isNaN(halfRate)) {\n          priceSpan.textContent = 'On quote';\n        } else {\n          priceSpan.textContent = formatEuro(dayRate) + ' / day · ' + formatEuro(halfRate) + ' / half-day';\n        }\n      });\n    }\n\n    function computeStudioPrice() {\n      const { rate, halfRate } = getStudioRate();\n      if (rate === null) return null;\n      let price = rate * getNumDays();\n      if (hasExtraHalf() && halfRate !== null) price += halfRate;\n      return price;\n    }\n\n    function updateGroupPrices() {\n      const basePrice = computeStudioPrice();\n      const priceNu = document.getElementById('price-nu');\n      const pricePack = document.getElementById('price-pack');\n      if (basePrice !== null) {\n        const nuPrice = basePrice - Math.round(basePrice * NU_DISCOUNT);\n        pricePack.innerHTML = formatEuro(basePrice) + '<span class=\"gh-unit\">For ' + getTotalDaysLabel() + (getTotalDaysLabel() === '1' ? ' day' : ' days') + '<\/span>';\n        priceNu.innerHTML = formatEuro(nuPrice) + '<span class=\"gh-unit\">−15% incl.<\/span>';\n      } else {\n        pricePack.innerHTML = 'On quote';\n        priceNu.innerHTML = 'On quote';\n      }\n    }\n\n    // ---- Pile d'onglets par formule (« Already included » / « Paid options »),\n    // ouverte au clic, ancrée sous la carte de la formule concernée. ----\n    let visibilityMode = null;\n    const FORMULA_ORDER = ['nu', 'pack', 'prelit', 'cleenmain'];\n    const MEGA_PANEL_IDS = { included: 'included-section', payant: 'payant-section', crew: 'crew-section' };\n\n    function showIncludedFor(formula) {\n      lastIncludedFormula = formula;\n      const photo = isPhotoStudio();\n      // Autres studios : comportement d'origine. Studios Photo : panneaux dédiés.\n      ['nu', 'pack', 'prelit', 'cleenmain'].forEach(f => {\n        const el = document.getElementById('included-' + f);\n        if (el) el.style.display = (!photo && f === formula) ? '' : 'none';\n      });\n      const phNu = document.getElementById('included-photo-nu');\n      const phPack = document.getElementById('included-photo-pack');\n      if (phNu) phNu.style.display = (photo && formula === 'nu') ? '' : 'none';\n      if (phPack) phPack.style.display = (photo && formula !== 'nu') ? '' : 'none';\n      if (photo) {\n        const visible = {\n          'ph-prelight-prelit': formula === 'prelit',\n          'ph-total-prelit':    formula === 'prelit',\n          'ph-studio-pack':     formula === 'pack',\n          'ph-total-pack':      formula === 'pack' && SHOW_SUPPLIER_PRICES,\n          'ph-ppm-turnkey':     formula === 'cleenmain',\n          'ph-studio-turnkey':  formula === 'cleenmain',\n          'ph-studio-prelit':   formula === 'prelit',\n          'ph-crew-turnkey':    formula === 'cleenmain',\n          'ph-total-turnkey':   formula === 'cleenmain' && SHOW_SUPPLIER_PRICES\n        };\n        Object.keys(visible).forEach(id => {\n          const el = document.getElementById(id);\n          if (el) el.hidden = !visible[id];\n        });\n        renderPhotoLists();\n      }\n    }\n    function setActiveTab(type, formula) {\n      document.querySelectorAll('.ft-tab.ft-' + type).forEach(btn => {\n        btn.classList.toggle('is-active', formula !== null && btn.dataset.formula === formula);\n      });\n    }\n    function positionMegaPanel(panel, formula) {\n      if (!panel) return;\n      if (window.innerWidth <= 1100) { panel.style.gridColumn = '1 / -1'; return; }\n      const span = 2;\n      const maxStart = 4 - span + 1;\n      const idx = FORMULA_ORDER.indexOf(formula);\n      const start = Math.min(idx + 1, maxStart);\n      panel.style.gridColumn = start + ' / span ' + span;\n    }\n    function toggleMegaTab(type, formula) {\n      const panel = document.getElementById(MEGA_PANEL_IDS[type]);\n      const btn = document.querySelector('.ft-tab.ft-' + type + '[data-formula=\"' + formula + '\"]');\n      const alreadyOpenForThisFormula = !!(panel && panel.open && btn && btn.classList.contains('is-active'));\n\n      // Mutuellement exclusif : ouvrir un panneau referme l'autre.\n      Object.keys(MEGA_PANEL_IDS).forEach(otherType => {\n        if (otherType === type) return;\n        const otherPanel = document.getElementById(MEGA_PANEL_IDS[otherType]);\n        if (otherPanel) otherPanel.open = false;\n        setActiveTab(otherType, null);\n      });\n\n      if (type === 'included') showIncludedFor(formula);\n      setActiveTab(type, alreadyOpenForThisFormula ? null : formula);\n      if (panel) panel.open = !alreadyOpenForThisFormula;\n      if (panel && !alreadyOpenForThisFormula) {\n        positionMegaPanel(panel, formula);\n        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });\n      }\n    }\n    document.querySelectorAll('.ft-tab.ft-included, .ft-tab.ft-payant, .ft-tab.ft-crew').forEach(btn => {\n      btn.addEventListener('click', () => {\n        const type = btn.classList.contains('ft-included') ? 'included' : btn.classList.contains('ft-payant') ? 'payant' : 'crew';\n        toggleMegaTab(type, btn.dataset.formula);\n      });\n    });\n    window.addEventListener('resize', () => {\n      Object.keys(MEGA_PANEL_IDS).forEach(type => {\n        const panel = document.getElementById(MEGA_PANEL_IDS[type]);\n        const btn = document.querySelector('.ft-tab.ft-' + type + '.is-active');\n        if (panel && panel.open && btn) positionMegaPanel(panel, btn.dataset.formula);\n      });\n    });\n\n    function updateStudioVisibility() {\n      const { studioName } = getStudioRate();\n      const isCasting = (studioName === 'Studio Casting 02' || studioName === 'Studio Casting 03');\n      const isWebcast = (studioName === 'Studio Webcast');\n      const isFittings = (studioName === 'Studio Fittings');\n      const isFondVert = (studioName === 'Studio Green Screen 00' || studioName === 'Studio Green Screen 01');\n\n      const nuFormula = document.querySelector('.formula-group[data-formula=\"nu\"]');\n      const formulaPicker = document.querySelector('.formula-picker');\n      const includedSection = document.getElementById('included-section');\n      const payantSection = document.getElementById('payant-section');\n      const crewSection = document.getElementById('crew-section');\n      const payantGroup = payantSection ? payantSection.querySelector('.cart-group[data-tier=\"payant\"]') : null;\n      const castingFormulas = document.getElementById('casting-formulas');\n      const castingExtraCategories = document.getElementById('casting-extra-categories');\n      const webcastFormulas = document.getElementById('webcast-formulas');\n      const fittingsFormulas = document.getElementById('fittings-formulas');\n\n      // Les formules standard (Nu / Avec pack inclus / Pré-lit / Clé en main) ne\n      // s'affichent que si on n'est ni en mode Casting, ni en mode Webcast, ni en mode Fittings.\n      // En mode Fond vert, seul « Nu » disparaît (Avec pack inclus reste).\n      const hideStandard = isCasting || isWebcast || isFittings;\n      if (nuFormula) nuFormula.style.display = (hideStandard || isFondVert) ? 'none' : '';\n      if (formulaPicker) formulaPicker.style.display = hideStandard ? 'none' : '';\n      if (castingFormulas) castingFormulas.style.display = isCasting ? '' : 'none';\n      if (castingExtraCategories) castingExtraCategories.style.display = isCasting ? '' : 'none';\n      if (webcastFormulas) webcastFormulas.style.display = isWebcast ? '' : 'none';\n      if (fittingsFormulas) fittingsFormulas.style.display = isFittings ? '' : 'none';\n\n      // Les panneaux « Already included » / « Paid options » sont pilotés par les\n      // onglets au survol en mode standard (photo / fond vert). En mode Casting /\n      // Webcast / Fittings, il n'y a pas de carte-formule pour les ouvrir : on\n      // affiche donc « Paid options » à plat, en pleine largeur, comme avant.\n      // On ne réinitialise l'ouverture des panneaux QUE lors d'un vrai changement\n      // de mode (sinon cocher une option à l'intérieur refermerait le panneau à\n      // chaque recompute()).\n      if (visibilityMode !== hideStandard) {\n        if (includedSection) includedSection.open = false;\n        if (payantSection) { payantSection.open = false; payantSection.style.gridColumn = ''; }\n        if (crewSection) { crewSection.open = false; crewSection.style.gridColumn = ''; }\n        setActiveTab('included', null);\n        setActiveTab('payant', null);\n        setActiveTab('crew', null);\n        visibilityMode = hideStandard;\n      }\n      if (hideStandard && payantSection) {\n        payantSection.open = true;\n        payantSection.style.gridColumn = '1 / -1';\n      }\n      if (hideStandard && crewSection) {\n        crewSection.open = true;\n        crewSection.style.gridColumn = '1 / -1';\n      }\n\n      // Toutes les formules (standard / casting / webcast) sont mutuellement exclusives :\n      // on décoche celles qui deviennent invisibles pour éviter un tarif incohérent.\n      const castingTierIds = ['tier-juste-espace', 'tier-studio-offert', 'tier-casting-long'];\n      const webcastTierIds = ['tier-webcast-simplifie', 'tier-webcast-habille', 'tier-webcast-dual'];\n      const fittingsTierIds = ['tier-fittings-1'];\n      const standardTierIds = ['tier-nu', 'tier-pack', 'tier-prelit', 'tier-cleenmain'];\n\n      const uncheck = ids => ids.forEach(id => {\n        const r = document.getElementById(id);\n        if (r) r.checked = false;\n      });\n\n      if (isCasting) {\n        uncheck(standardTierIds);\n        uncheck(webcastTierIds);\n        uncheck(fittingsTierIds);\n      } else if (isWebcast) {\n        uncheck(standardTierIds);\n        uncheck(castingTierIds);\n        uncheck(fittingsTierIds);\n      } else if (isFittings) {\n        uncheck(standardTierIds);\n        uncheck(castingTierIds);\n        uncheck(webcastTierIds);\n      } else if (isFondVert) {\n        uncheck(['tier-nu']);\n        uncheck(castingTierIds);\n        uncheck(webcastTierIds);\n        uncheck(fittingsTierIds);\n        if (!document.querySelector('input[name=\"tier\"]:checked')) {\n          const packRadio = document.getElementById('tier-pack');\n          if (packRadio) packRadio.checked = true;\n        }\n      } else {\n        uncheck(castingTierIds);\n        uncheck(webcastTierIds);\n        uncheck(fittingsTierIds);\n        if (!document.querySelector('input[name=\"tier\"]:checked')) {\n          const packRadio = document.getElementById('tier-pack');\n          if (packRadio) packRadio.checked = true;\n        }\n      }\n\n      // Paid options : masquées entièrement pour \"Casting long métrage\",\n      // filtrées sur Restauration uniquement en mode casting,\n      // et allégées (5 éléments masqués) en mode Webcast.\n      const currentTier = getSelectedTier();\n      const webcastHiddenCategories = ['In-studio monitor playback', 'Video camera', 'Audio pack', 'Flash', 'Overtime'];\n      const fittingsHiddenCategories = ['In-studio monitor playback', 'Video camera', 'Audio pack', 'Flash'];\n      if (payantGroup) {\n        const hidePayantEntirely = (currentTier === 'casting-long');\n        payantGroup.style.display = hidePayantEntirely ? 'none' : '';\n        const cycloDefault1 = document.getElementById('cyclo-default');\n        const cycloDefault2 = document.getElementById('cyclo-default-2');\n        const cycloFittings = document.getElementById('cyclo-fittings');\n        if (isCasting) {\n          if (cycloDefault1) cycloDefault1.style.display = 'none';\n          if (cycloDefault2) cycloDefault2.style.display = 'none';\n          if (cycloFittings) cycloFittings.style.display = 'none';\n        } else if (isFittings) {\n          if (cycloDefault1) cycloDefault1.style.display = 'none';\n          if (cycloDefault2) cycloDefault2.style.display = 'none';\n          if (cycloFittings) cycloFittings.style.display = '';\n        } else {\n          if (cycloDefault1) cycloDefault1.style.display = '';\n          if (cycloDefault2) cycloDefault2.style.display = '';\n          if (cycloFittings) cycloFittings.style.display = 'none';\n        }\n        payantGroup.querySelectorAll('.fittings-only').forEach(pl => {\n          pl.style.display = isFittings ? '' : 'none';\n        });\n        const consommablesFer = document.getElementById('consommables-fer');\n        if (consommablesFer) consommablesFer.style.display = isFittings ? 'none' : '';\n        payantGroup.querySelectorAll(':scope > .price-line').forEach(pl => {\n          if (pl.id === 'cyclo-default' || pl.id === 'cyclo-default-2' || pl.id === 'cyclo-fittings' || pl.classList.contains('fittings-only')) return;\n          pl.style.display = isCasting ? 'none' : '';\n        });\n        payantGroup.querySelectorAll(':scope > .sub-cat').forEach(sc => {\n          if (sc.classList.contains('fittings-only')) return;\n          const summaryEl = sc.querySelector(':scope > summary');\n          const label = summaryEl ? summaryEl.textContent.replace(/[×+]/g, '').trim() : '';\n          if (isCasting) {\n            sc.style.display = (label === 'Catering') ? '' : 'none';\n          } else if (isWebcast) {\n            sc.style.display = webcastHiddenCategories.includes(label) ? 'none' : '';\n          } else if (isFittings) {\n            sc.style.display = fittingsHiddenCategories.includes(label) ? 'none' : '';\n          } else {\n            sc.style.display = '';\n          }\n        });\n\n        // En mode Webcast, Restauration doit apparaître avant Consommables\n        if (isWebcast) {\n          const subCats = Array.from(payantGroup.querySelectorAll(':scope > .sub-cat'));\n          const restaurationEl = subCats.find(sc => {\n            const s = sc.querySelector(':scope > summary');\n            return s && s.textContent.replace(/[×+]/g, '').trim() === 'Catering';\n          });\n          const consommablesEl = subCats.find(sc => {\n            const s = sc.querySelector(':scope > summary');\n            return s && s.textContent.replace(/[×+]/g, '').trim() === 'Consumables';\n          });\n          if (restaurationEl && consommablesEl) {\n            payantGroup.insertBefore(restaurationEl, consommablesEl);\n          }\n        }\n\n        // En mode Casting, ces 3 items de Restauration ne s'appliquent pas\n        const castingHiddenRestoItems = ['resto-petit-dej-standard', 'resto-petit-dej-gourmand', 'resto-dejeuner-bureaux'];\n        castingHiddenRestoItems.forEach(id => {\n          const el = document.getElementById(id);\n          if (el) el.style.display = isCasting ? 'none' : '';\n        });\n\n        const maximalocBlock = document.getElementById('maximaloc-block');\n        if (maximalocBlock) maximalocBlock.style.display = isCasting ? 'none' : '';\n      }\n\n      // En mode Casting, \"Casting Assistant\" remonte juste après \"Set assistant\"\n      // (au lieu de sa 3e position d'origine), pour rester visible dès l'ouverture\n      // de \"Complete your team\" sans avoir à faire défiler les autres catégories.\n      reorderCrewForCasting(isCasting);\n      filterCrewForCasting(isCasting, isWebcast);\n    }\n\n    // Studio Casting 02 / 03 : seuls Casting Assistant et Video Technician restent\n    // dans « Complete your team ». Les profils masqués sont décochés pour ne pas\n    // rester dans le devis.\n    const CASTING_HIDDEN_CREW = ['Set assistant', 'Photo Assistant', 'Director', 'Photographer',\n      'Producer', 'Casting Director', 'Art Director', 'AI Content Creator',\n      'Stylist', 'Stylist Assistant', 'Brand Coaching', 'AI vs. Conventional'];\n    const CASTING_HIDDEN_VT_ITEMS = [\"Teleprompter operator with PRO 14'' teleprompter\", 'Sound engineer',\n      'Versatile camera & sound technician', 'Versatile technician — studio set-up', 'Versatile assistant'];\n    // Studio Webcast : seuls Set assistant et Video Technician restent.\n    const WEBCAST_HIDDEN_CREW = ['Photo Assistant', 'Casting Assistant', 'Director', 'Photographer', 'Producer', 'Casting Director',\n      'Art Director', 'AI Content Creator', 'Stylist', 'Stylist Assistant', 'Brand Coaching', 'AI vs. Conventional'];\n    function filterCrewForCasting(isCasting, isWebcast) {\n      const container = document.querySelector('#crew-section > div[data-ph=\"not\"]');\n      if (!container) return;\n      // Dans Video Technician, seul « Camera operator » reste pour les studios casting\n      container.querySelectorAll('.opt-check').forEach(c => {\n        if (!CASTING_HIDDEN_VT_ITEMS.includes(c.dataset.label)) return;\n        const li = c.closest('li');\n        const hideItem = isCasting;\n        if (li) li.style.display = hideItem ? 'none' : '';\n        if (hideItem && c.checked) {\n          c.checked = false;\n          c.dispatchEvent(new Event('change', { bubbles: true }));\n        }\n      });\n      container.querySelectorAll(':scope > details.sub-cat').forEach(d => {\n        const nameEl = d.querySelector(':scope > summary .crew-name');\n        const topChk = d.querySelector(':scope > summary .opt-check');\n        const name = nameEl ? nameEl.textContent.trim() : (topChk ? topChk.dataset.label : '');\n        const hide = (isCasting && CASTING_HIDDEN_CREW.includes(name)) || (isWebcast && WEBCAST_HIDDEN_CREW.includes(name));\n        d.style.display = hide ? 'none' : '';\n        if (hide) {\n          d.open = false;\n          d.querySelectorAll('.opt-check:checked').forEach(c => {\n            c.checked = false;\n            c.dispatchEvent(new Event('change', { bubbles: true }));\n          });\n        }\n      });\n    }\n\n    function reorderCrewForCasting(isCasting) {\n      const container = document.querySelector('#crew-section > div[data-ph=\"not\"]');\n      if (!container) return;\n      const subCats = Array.from(container.querySelectorAll(':scope > details.sub-cat'));\n      const findByName = (name) => subCats.find(d => {\n        const el = d.querySelector(':scope > summary .crew-name');\n        return el && el.textContent.trim() === name;\n      });\n      const castingAssistant = findByName('Casting Assistant');\n      const videoTechnician = findByName('Video Technician');\n      const director = findByName('Director');\n      if (!castingAssistant) return;\n      if (isCasting && videoTechnician) {\n        container.insertBefore(castingAssistant, videoTechnician);\n      } else if (!isCasting && director) {\n        container.insertBefore(castingAssistant, director);\n      }\n    }\n\n    // Renseigne ici l'URL de la photo réelle de chaque studio (ex: 'images/casting-02.jpg').\n    // Tant qu'une URL n'est pas renseignée, seul le texte du libellé change.\n    const STUDIO_PHOTOS = {\n      'Studio Photo 00': '',\n      'Studio Photo 01': '',\n      'Studio Video 00': '',\n      'Studio Video 01': '',\n      'Studio Green Screen 00': '',\n      'Studio Green Screen 01': '',\n      'Studio Casting 02': '',\n      'Studio Casting 03': '',\n      'Studio Webcast': '',\n      'Studio Fittings': '',\n    };\n\n    function renderStudioPreview() {\n      const { studioName } = getStudioRate();\n      const imgEl = document.getElementById('studio-preview-img');\n      const labelEl = document.getElementById('studio-preview-label');\n      const hasStudio = studioName && studioName !== 'Studio';\n\n      if (labelEl) labelEl.textContent = hasStudio ? `Photo — ${studioName}` : 'Photo — Studio';\n\n      if (imgEl) {\n        const url = hasStudio ? STUDIO_PHOTOS[studioName] : '';\n        imgEl.style.backgroundImage = url ? `url('${url}')` : 'none';\n      }\n    }\n\n    function renderPrelitCleenmainPrices() {\n      const { studioName } = getStudioRate();\n      const isFondVertStudio = (studioName === 'Studio Green Screen 00' || studioName === 'Studio Green Screen 01');\n      const prelitDay = document.getElementById('prelit-price-day');\n      const prelitHalf = document.getElementById('prelit-price-half');\n      const cleenmainPrice = document.getElementById('cleenmain-price');\n      if (prelitDay) prelitDay.innerHTML = (isFondVertStudio ? '1450€' : '1350€') + '<span class=\"ppd-unit\">/day<\/span>';\n      if (prelitHalf) prelitHalf.innerHTML = (isFondVertStudio ? '1205€' : '1120€') + '<span class=\"ppd-unit\">/half-day<\/span>';\n      if (cleenmainPrice) cleenmainPrice.textContent = isPhotoStudio() ? formatEuro(PHOTO_TURNKEY_DAY_PRICE * photoDayUnits()) : (isFondVertStudio ? '2370€' : '2200€');\n    }\n\n    // ---- Talents in the order summary ----\n    function escHtml(v) {\n      return String(v == null ? '' : v).replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n    }\n    function currentTalents() {\n      if (typeof window.getBellanoTalents === 'function') return window.getBellanoTalents();\n      try { return JSON.parse(localStorage.getItem('bellanoTalents') || '[]'); } catch (e) { return []; }\n    }\n    function summaryTalentLines() {\n      const ts = currentTalents();\n      if (!ts.length) return [];\n      const out = [{ type: 'category', name: 'Kollektiv talents', talent: true }];\n      ts.forEach(t => out.push({\n        type: 'item', talent: true, value: 'On quote',\n        name: escHtml(t.name) + ' <span class=\"sl-talent-meta\">' + escHtml(t.id) + ' · ' + escHtml(t.role) + '<\/span>'\n      }));\n      return out;\n    }\n    window.bellanoSummaryTalentLines = summaryTalentLines;\n\n    // Valeur réelle (studio + équipement inclus) vs prix facturé, par studio et par formule,\n    // calculée dans les panneaux « Already included » et réutilisée dans le récapitulatif.\n    const packageSavings = {};\n    function recordSaving(key, value, price) {\n      packageSavings[key] = (price === null || price === undefined || isNaN(price) || isNaN(value)) ? null : { value, price };\n    }\n\n    // Studios Photo, Vidéo et Green Screen : intitulés communs des cartes formules (data-vid-text), texte d'origine ailleurs\n    function applyVideoCardLabels() {\n      const vid = isVideoStudio() || isPhotoStudio();   // Vidéo + Green Screen + Photo\n      document.querySelectorAll('[data-vid-text]').forEach(el => {\n        if (el.dataset.defaultText === undefined) el.dataset.defaultText = el.textContent;\n        el.textContent = vid ? el.dataset.vidText : el.dataset.defaultText;\n      });\n    }\n\n    // Détail du calcul sous le choix de durée, ex. « 1 day × 790€ + ½ day × 550€ = 1340€ »\n    function renderDurationBreakdown() {\n      const el = document.getElementById('duration-breakdown');\n      if (!el) return;\n      const tier = getSelectedTier();\n      const base = computeBasePrice();\n      const n = getNumDays();\n      const half = hasExtraHalf();\n      const { isDemi } = getStudioRate();\n      if (base === null || base === undefined || isNaN(base) || tier === 'studio-offert' || tier === 'casting-long') { el.textContent = ''; return; }\n      const unitN = n + ' ' + (isDemi ? (n > 1 ? 'half-days' : 'half-day') : (n > 1 ? 'days' : 'day'));\n      let txt;\n      if (tier === 'cleenmain' || tier === 'prelit' || tier.indexOf('webcast') === 0 || tier === 'fittings-1' || tier === 'juste-espace') {\n        txt = unitN + (half ? ' + ½ day' : '') + ' = ' + formatEuro(Math.round(base));\n      } else {\n        const { dayRate, halfRate } = getActiveRates();\n        const unit = isDemi ? halfRate : dayRate;\n        txt = n + ' × ' + (isDemi ? '½ day' : 'day') + ' ' + formatEuro(unit) + (half ? ' + ½ day ' + formatEuro(halfRate) : '') + ' = ' + formatEuro(Math.round(base));\n      }\n      if (tier === 'nu') txt += ' → −15% = ' + formatEuro(base - Math.round(base * NU_DISCOUNT));\n      el.textContent = txt;\n    }\n\n    function recompute() {\n      updateStudioVisibility();\n      renderStudioListPrices();\n      renderLightingList();\n      renderSharedIncludedLists();\n      renderVideoValues();\n      renderTeamList();\n      renderOvertimeList();\n      renderStudioPreview();\n      renderPrelitCleenmainPrices();\n      updateGroupPrices();\n      renderPhotoPage();\n      applyVideoCardLabels();\n      renderDurationBreakdown();\n\n      const tier = getSelectedTier();\n      const { studioName } = getStudioRate();\n      const basePrice = computeBasePrice();\n      let total = basePrice || 0;\n      const lines = [];\n\n      const totalDaysLabel = getTotalDaysLabel();\n      const { isDemi } = getStudioRate();\n      const plural = getNumDays() > 1 || hasExtraHalf();\n      const unitLabel = isDemi ? (plural ? 'half-days' : 'half-day') : (plural ? 'days' : 'day');\n\n      if (tier === 'cleenmain') {\n        lines.push({ type: 'line', name: `\"Turnkey\" package (${totalDaysLabel} ${unitLabel})`, value: (isPhotoStudio() ? 'starting from ' : '') + formatEuro(basePrice) });\n        lines.push({ type: 'line', name: 'Full production with the Kollektiv team', value: '—' });\n      } else if (tier === 'juste-espace') {\n        const unitOnly = `${totalDaysLabel} ${unitLabel}`;\n        lines.push({ type: 'line', name: `Space only — ${unitOnly}`, value: formatEuro(basePrice) });\n        lines.push({ type: 'note', title: 'Fully equipped set', text: \"Camera, computer, recording system and 60-inch monitor playback included.\" });\n        lines.push({ type: 'note', title: 'Pre-set lighting', text: 'Set-up already in place, on a concrete cyclorama or blue paper background.' });\n      } else if (tier === 'webcast-simplifie' || tier === 'webcast-habille' || tier === 'webcast-dual') {\n        const unitOnly = `${totalDaysLabel} ${unitLabel}`;\n        const webcastNames = {\n          'webcast-simplifie': 'Simplified (2 technicians)',\n          'webcast-habille': 'Dressed up (3 technicians)',\n          'webcast-dual': 'Dual set with white/green background',\n        };\n        lines.push({ type: 'line', name: `${webcastNames[tier]} — ${unitOnly}`, value: formatEuro(basePrice) });\n\n        if (tier === 'webcast-simplifie') {\n          lines.push({ type: 'note', title: 'Fully equipped set', text: \"4 Panasonic AW-HE40 cameras (PTZ, AW-RP50 control), 5 Sennheiser microphones (MZH 3015 W + ME35), Atem vision mixer, encoding computer, and slide playback on 3 60-inch screens. Simple split-screen and (non-animated) lower-third options included. No remote speaker.\" });\n          lines.push({ type: 'note', title: \"Number of speakers\", text: 'Max. 5: one central presenter, with 2 people on each side.' });\n          lines.push({ type: 'note', title: 'Live duration', text: 'Max. 2.5 hours per half-day.' });\n        } else if (tier === 'webcast-habille') {\n          lines.push({ type: 'note', title: 'Fully equipped set', text: \"4 Panasonic AW-HE40 cameras (PTZ, AW-RP50 control), 5 Sennheiser microphones (MZH 3015 W + ME35), vMix computer, encoding computer, and slide playback on 3 60-inch screens. Advanced split-screen, lower-third and motion-graphics options.\" });\n          lines.push({ type: 'note', title: \"Number of speakers\", text: 'Max. 5: one central presenter, with 2 people on each side.' });\n          lines.push({ type: 'note', title: 'Live duration', text: 'Max. 2.5 hours per half-day.' });\n        } else {\n          lines.push({ type: 'note', title: 'Two fully equipped sets', text: \"4 Panasonic AW-HE40 cameras (TV set) + 2 Sony Alpha 7 III cameras (cyclorama), 5 Sennheiser microphones (MZH 3015 W + ME35) + shotgun/wireless mics on the cyclorama, vMix computer, encoding computer, and slide playback on 4 60-inch screens. Advanced split-screen, lower-third and motion-graphics options.\" });\n          lines.push({ type: 'note', title: \"Number of speakers\", text: \"Max. 8: 2 presenters, with up to 6 simultaneous speakers.\" });\n          lines.push({ type: 'note', title: 'Live duration', text: 'Max. 2.5 hours per half-day.' });\n          lines.push({ type: 'note', title: 'Extras (paid option)', text: 'Customization of the 2nd set, on quote.' });\n        }\n      } else if (tier === 'fittings-1') {\n        const unitOnly = `${totalDaysLabel} ${unitLabel}`;\n        lines.push({ type: 'line', name: `Fittings Package — ${unitOnly}`, value: formatEuro(basePrice) });\n      } else if (tier === 'studio-offert') {\n        lines.push({ type: 'line', name: '\"Free studio day\" package', value: formatEuro(basePrice) });\n        lines.push({ type: 'note', title: '4 jours + 1 offert', text: \"Rent 4 days of casting studio and enjoy a free 5th day.\" });\n        lines.push({ type: 'note', title: 'Same production, same team', text: 'Valid as long as the days are for the same production and the same casting director.' });\n      } else if (tier === 'casting-long') {\n        lines.push({ type: 'line', name: '\"Feature film casting\" package', value: 'from ' + formatEuro(basePrice) + ' / week' });\n        lines.push({ type: 'note', title: 'Tapered rate', text: 'A rate suited to feature-film productions, with bookings by the week or by the month.' });\n        lines.push({ type: 'note', title: 'Dedicated studio', text: 'The casting studio stays reserved for the whole duration of your production.' });\n      } else if (tier === 'prelit') {\n        if (basePrice !== null) {\n          lines.push({ type: 'line', name: `Pre-lit studio (${totalDaysLabel} ${unitLabel})`, value: formatEuro(basePrice) });\n        } else {\n          lines.push({ type: 'line', name: 'Pre-lit studio — rate on request', value: '—' });\n        }\n        lines.push({ type: 'note', title: 'Pre-light half-day, -50%', text: 'Book the half-day before your shoot at -50%: your set-up is ready when you arrive.' });\n        const techPrice = isPhotoStudio() ? PHOTO_PRELIT_TECHNICIAN : 250;\n        lines.push({ type: 'note', title: `Versatile technician — ${techPrice}€`, text: `A versatile technician sets up your lighting, cameras, sound and backgrounds the day before — for ${techPrice}€.` });\n      } else {\n        if (basePrice !== null) {\n          lines.push({ type: 'line', name: `${studioName} (${totalDaysLabel} ${unitLabel})`, value: formatEuro(basePrice) });\n        } else {\n          lines.push({ type: 'line', name: `${studioName} — rate on request`, value: '—' });\n        }\n\n        if (tier === 'nu') {\n          const discount = Math.round((basePrice || 0) * NU_DISCOUNT);\n          total -= discount;\n          lines.push({ type: 'line', name: '\"Bare (no lighting)\" package — discount on the studio rate only', value: '− ' + formatEuro(discount), discount: true });\n        } else {\n          lines.push({ type: 'line', name: '\"With package included\" package', value: 'Included' });\n        }\n      }\n\n      // Économie de la formule : valeur du studio + équipement inclus vs prix facturé\n      let pkgValue = 0, pkgSaving = 0;\n      if (tier === 'nu') {\n        pkgValue = basePrice || 0;\n        pkgSaving = Math.round((basePrice || 0) * NU_DISCOUNT);\n      } else if (tier === 'pack' || tier === 'prelit' || tier === 'cleenmain') {\n        const kind = isPhotoStudio() ? 'photo' : (isVideoStudio() ? 'video' : null);\n        const rec = kind ? packageSavings[kind + '-' + tier] : null;\n        if (rec && rec.value > rec.price && basePrice !== null) {\n          pkgValue = rec.value;\n          pkgValue = Math.round(pkgValue);\n          pkgSaving = Math.round(rec.value - rec.price);\n          const pctLine = Math.floor(pkgSaving / pkgValue * 100);\n          lines.push({ type: 'line', name: 'Value of studio + equipment', value: '<span class=\"sl-strike\">' + formatEuro(pkgValue) + '<\/span>', muted: true });\n          lines.push({ type: 'line', name: 'Package discount (' + pctLine + '%)', value: '−' + formatEuro(pkgSaving), discount: true });\n        }\n      }\n\n      // Supplément automatique week-end / jour férié : 110 € par jour concerné\n      // dans la plage de dates sélectionnée sur le calendrier.\n      const surchargeDays = getWeekendHolidayDaysCount();\n      if (surchargeDays > 0) {\n        const surchargeTotal = surchargeDays * WEEKEND_HOLIDAY_SURCHARGE;\n        total += surchargeTotal;\n        const dayLabel = surchargeDays > 1 ? 'days' : 'day';\n        lines.push({ type: 'line', name: `Weekend / public holiday surcharge (${surchargeDays} ${dayLabel})`, value: '+ ' + formatEuro(surchargeTotal) });\n      }\n\n      // Paid options groupées par catégorie — la catégorie n'apparaît\n      // que si au moins une option de ce groupe est cochée.\n      document.querySelectorAll('.sub-cat').forEach(details => {\n        const checked = Array.from(details.querySelectorAll('.opt-check')).filter(c => c.checked && c.closest('.sub-cat') === details);\n        if (checked.length === 0) return;\n\n        const summaryClone = details.querySelector(':scope > summary').cloneNode(true);\n        summaryClone.querySelectorAll('.rm, .pm-slot').forEach(el => el.remove());\n        lines.push({ type: 'category', name: summaryClone.textContent.trim() });\n\n        checked.forEach(chk => {\n          const price = parseFloat(chk.dataset.price) || 0;\n          total += price;\n          lines.push({ type: 'item', name: chk.dataset.label, value: price > 0 ? '+ ' + formatEuro(price) : '—' });\n        });\n      });\n\n      // Talents chosen on the Kollektiv / Coaching pages (fees confirmed in the quote)\n      summaryTalentLines().forEach(l => lines.push(l));\n\n      summaryList.innerHTML = '';\n      lines.forEach(l => {\n        const li = document.createElement('li');\n        if (l.type === 'category') {\n          li.className = 'summary-category' + (l.talent ? ' summary-talent' : '');\n          li.textContent = l.name;\n        } else if (l.type === 'note') {\n          li.className = 'summary-note';\n          li.innerHTML = '<span class=\"sn-title\">' + l.title + '<\/span><span class=\"sn-text\">' + l.text + '<\/span>';\n        } else {\n          li.classList.add(l.type === 'item' ? 'summary-item' : 'summary-base');\n          if (l.discount) li.classList.add('discount');\n          if (l.muted) li.classList.add('muted');\n          if (l.talent) li.classList.add('summary-talent');\n          li.innerHTML = '<span class=\"sl-name\">' + l.name + '<\/span><span class=\"sl-val\">' + l.value + '<\/span>';\n        }\n        summaryList.appendChild(li);\n      });\n\n      emptyNote.style.display = 'none';\n      document.querySelector('.discount-note').style.display = (tier === 'nu') ? 'block' : 'none';\n      totalValue.textContent = formatEuro(total);\n      if (totalValueVat) totalValueVat.textContent = formatEuro(Math.round(total * (1 + VAT_RATE)));\n\n      // Prix barré + pastilles « You save » / « % OFF » (mêmes pastilles que le panneau Already included)\n      const pct = pkgValue > 0 ? Math.floor(pkgSaving / pkgValue * 100) : 0;\n      const showSaving = pkgSaving > 0 && pct > 0;\n      ['', 'billing-'].forEach(pre => {\n        const oldEl = document.getElementById(pre + 'total-old');\n        const saveEl = document.getElementById(pre + 'total-save');\n        const offEl = document.getElementById(pre + 'total-off');\n        if (oldEl) oldEl.textContent = showSaving ? formatEuro(total + pkgSaving) : '';\n        if (saveEl) saveEl.textContent = showSaving ? 'You save\\u00a0' + formatEuro(pkgSaving) : '';\n        if (offEl) offEl.textContent = showSaving ? pct + '%\\u00a0OFF' : '';\n      });\n\n      // Le récapitulatif de l'étape « Facturation » reprend le même contenu.\n      if (billingSummaryList) billingSummaryList.innerHTML = summaryList.innerHTML;\n      if (billingTotalValue) billingTotalValue.textContent = totalValue.textContent;\n      if (billingTotalValueVat && totalValueVat) billingTotalValueVat.textContent = totalValueVat.textContent;\n    }\n\n    window.bellanoRecompute = recompute;\n    tierRadios.forEach(r => r.addEventListener('change', recompute));\n\n    // \"Formule studio offert\" = 5 jours (4 loués + 1 offert). On pré-sélectionne\n    // une plage de 5 jours dans le calendrier, que le client peut ensuite déplacer librement.\n    const studioOffert
